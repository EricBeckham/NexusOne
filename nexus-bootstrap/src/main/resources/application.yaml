spring:
  application:
    name: nexusone
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${NEXUS_DB_URL:jdbc:postgresql://127.0.0.1:5432/nexusone}
    username: ${NEXUS_DB_USER:postgres}
    password: ${NEXUS_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform
    default-schema: platform
    table: flyway_schema_history
    validate-on-migrate: true
    create-schemas: true
  sql:
    init:
      mode: never

server:
  port: ${NEXUS_HTTP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

# Single nexus map: M0-09 execution, M0-12 P1/P2, M0-11 crypto/audit, M0-10 cache/files/notify, M0-07 studio.
# Library application.yml files are not the monolith’s config source.
#
# M0-09 knobs (product boot runs the Outbox dispatcher; ITs that must observe
# PENDING notify.inbox set nexus.execution.dispatcher-enabled=false):
#   dispatcher-enabled  true     — SmartLifecycle auto-start for notify.inbox
#   poll-interval       500ms    — start-of-delivery P95 target ≤ 5s
#   lag-warn-after      30s      — OUTBOX_LAG_ALARM on oldest PENDING/FAILED
#   batch-size          16
#   max-attempts        5
#   lease-duration      30s
#   worker-enabled      true     — task queue worker (separate from Outbox)
#   quartz-enabled      true
#   quartz-auto-startup true
nexus:
  # 禁止连生产 / 默认关闭。不要把 spring profile demo 放进正式启动。
  # 说明：docs/engineering/demo-profile.md
  demo:
    enabled: ${NEXUS_DEMO_ENABLED:false}
    environment: ${NEXUS_DEMO_ENVIRONMENT:local}
  execution:
    dispatcher-enabled: true
    worker-enabled: true
    quartz-enabled: true
    quartz-auto-startup: true
    poll-interval: 500ms
    lease-duration: 30s
    lag-warn-after: 30s
    batch-size: 16
    max-attempts: 5
  p1:
    platform-read-context:
      enabled: ${NEXUS_P1_PLATFORM_READ_CONTEXT_ENABLED:false}
    demo-context:
      enabled: ${NEXUS_P1_DEMO_CONTEXT_ENABLED:false}
  # DEMO-U2: one-shot platform duty install. Default off. Must stay off together with demo context.
  platform-duty-bootstrap:
    enabled: ${NEXUS_PLATFORM_DUTY_BOOTSTRAP_ENABLED:false}
  platform:
    status:
      # Per-probe wall clock. A timed-out dependency is UNKNOWN and does not block the others.
      probe-timeout: ${NEXUS_PLATFORM_STATUS_PROBE_TIMEOUT:2s}
  p3:
    demo-context: ${NEXUS_P3_DEMO_CONTEXT_ENABLED:false}
  iam:
    persistence: ${NEXUS_IAM_PERSISTENCE:memory}
    # jdbc persistence shares the product database by default. The main Flyway above owns
    # classpath:db/migration (incl. iam); the module must not re-run it.
    jdbc:
      url: ${NEXUS_IAM_JDBC_URL:${spring.datasource.url}}
      username: ${NEXUS_IAM_JDBC_USERNAME:${spring.datasource.username}}
      password: ${NEXUS_IAM_JDBC_PASSWORD:${spring.datasource.password}}
      migrate: false
    idp: ${NEXUS_IAM_IDP:stub}
    platform-bootstrap-token: ${NEXUS_PLATFORM_BOOTSTRAP_TOKEN:${NEXUS_IAM_PLATFORM_BOOTSTRAP_TOKEN:}}
  tls:
    gm:
      # Opt-in local dual-cert material. Default HTTP connector stays on. Not GM/T 0024 Nginx.
      enabled: ${NEXUS_GM_TLS_ENABLED:false}
      dir: ${NEXUS_GM_TLS_DIR:.local/g17-gm-tls}
  crypto:
    suite: ${NEXUS_CRYPTO_SUITE:INTERNATIONAL}
    key-source: ${NEXUS_CRYPTO_KEY_SOURCE:ephemeral}
    key-id: ${NEXUS_CRYPTO_KEY_ID:local}
    key-version: ${NEXUS_CRYPTO_KEY_VERSION:1}
    master-key: ${NEXUS_CRYPTO_MASTER_KEY:}
  audit:
    persistence: ${NEXUS_AUDIT_PERSISTENCE:jdbc}
    archive:
      # Opt-in daily Quartz (02:30 UTC). Default off so ITs do not fire a platform Job.
      schedule-enabled: ${NEXUS_AUDIT_ARCHIVE_SCHEDULE_ENABLED:false}
    cold-archive:
      # Opt-in daily Quartz (02:45 UTC) after the same-PG copy. Default off.
      # Object bytes go through ObjectStoragePort (Counting Fake or MinIO via SecretPort).
      schedule-enabled: ${NEXUS_AUDIT_COLD_ARCHIVE_SCHEDULE_ENABLED:false}
    hot-purge:
      # Opt-in daily Quartz (03:00 UTC) after archive copy + cold copy. Default off.
      # Deletes only a copied 90-day hot prefix. Does not DROP platform.audit_record.
      schedule-enabled: ${NEXUS_AUDIT_HOT_PURGE_SCHEDULE_ENABLED:false}
  permission:
    persistence: ${NEXUS_PERMISSION_PERSISTENCE:memory}
    # Same as nexus.iam.jdbc: shares the product database; the main Flyway already applied iam perm_* tables.
    jdbc:
      url: ${NEXUS_PERMISSION_JDBC_URL:${spring.datasource.url}}
      username: ${NEXUS_PERMISSION_JDBC_USERNAME:${spring.datasource.username}}
      password: ${NEXUS_PERMISSION_JDBC_PASSWORD:${spring.datasource.password}}
      migrate: false
    seed-tenant-member-grants: ${NEXUS_PERMISSION_SEED_TENANT_MEMBER_GRANTS:true}
    # PLA5: legacy = every member seeded personally + all installed portal entries shown;
    # position = member roles only via position bindings + portal entries by fn.* grants.
    member-access: ${NEXUS_PERMISSION_MEMBER_ACCESS:legacy}
    snapshot-load-timeout: ${NEXUS_PERM_SNAPSHOT_LOAD_TIMEOUT:2s}
  cache:
    env: ${NEXUS_CACHE_ENV:dev}
    mode: ${NEXUS_CACHE_MODE:auto}
    host: ${NEXUS_REDIS_HOST:127.0.0.1}
    port: ${NEXUS_REDIS_PORT:6379}
  files:
    persistence: jdbc
    storage: ${NEXUS_FILE_STORAGE:memory}
    bucket-alias: nexus-files
    demo-context: false
    platform-bootstrap-token: ${NEXUS_FILE_BOOTSTRAP_TOKEN:}
    s3:
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_TEST_BUCKET:nexus-files}
      # access/secret keys: SecretPort only (S3_ACCESS_KEY / S3_SECRET_KEY). Not Spring properties.
  notify:
    persistence: jdbc
    outbox: auto
    demo-context: false
  studio:
    persistence: ${NEXUS_STUDIO_PERSISTENCE:jdbc}
    demo-context: ${NEXUS_STUDIO_DEMO_CONTEXT:false}
    seed-demo-metadata: ${NEXUS_STUDIO_SEED_DEMO_METADATA:true}
  flow:
    engine: flowable-7.1.0-in-process


info:
  app:
    name: NexusOne
    work-package: M0-01
    spring-boot: "4.1.1"
    java: "21"
    flyway-pin: "13.7.0"

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    one.nexus: INFO
