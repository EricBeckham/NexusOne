spring:
  application:
    name: nexusone
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${NEXUS_DB_URL:jdbc:postgresql://127.0.0.1:5432/nexusone}
    username: ${NEXUS_DB_USER:postgres}
    password: ${NEXUS_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform
    default-schema: platform
    table: flyway_schema_history
    validate-on-migrate: true
    create-schemas: true
  sql:
    init:
      mode: never

server:
  port: ${NEXUS_HTTP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  app:
    name: NexusOne
    work-package: M0-01
    spring-boot: "4.1.1"
    java: "21"
    flyway-pin: "13.7.0"

# Library application.yml files are not the monolith’s config source.
# Bind P1/P2 env vars here so M0-12 scripts and the Vue shell can call merged APIs.
nexus:
  p1:
    demo-context:
      enabled: ${NEXUS_P1_DEMO_CONTEXT_ENABLED:false}
  iam:
    persistence: ${NEXUS_IAM_PERSISTENCE:memory}
    idp: ${NEXUS_IAM_IDP:stub}
    platform-bootstrap-token: ${NEXUS_PLATFORM_BOOTSTRAP_TOKEN:${NEXUS_IAM_PLATFORM_BOOTSTRAP_TOKEN:}}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    one.nexus: INFO
