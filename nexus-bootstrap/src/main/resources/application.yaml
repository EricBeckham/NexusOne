spring:
  application:
    name: nexusone
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${NEXUS_DB_URL:jdbc:postgresql://127.0.0.1:5432/nexusone}
    username: ${NEXUS_DB_USER:postgres}
    password: ${NEXUS_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform
    default-schema: platform
    table: flyway_schema_history
    validate-on-migrate: true
    create-schemas: true
  sql:
    init:
      mode: never

server:
  port: ${NEXUS_HTTP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

# Single nexus map: M0-09 execution, M0-12 P1/P2 bindings, M0-11 crypto/audit.
# Library application.yml files are not the monolith’s config source.
nexus:
  execution:
    dispatcher-enabled: true
    worker-enabled: true
    quartz-enabled: true
    quartz-auto-startup: true
    poll-interval: 500ms
    lease-duration: 30s
    lag-warn-after: 30s
    batch-size: 16
    max-attempts: 5
  p1:
    demo-context:
      enabled: ${NEXUS_P1_DEMO_CONTEXT_ENABLED:false}
  iam:
    persistence: ${NEXUS_IAM_PERSISTENCE:memory}
    idp: ${NEXUS_IAM_IDP:stub}
    platform-bootstrap-token: ${NEXUS_PLATFORM_BOOTSTRAP_TOKEN:${NEXUS_IAM_PLATFORM_BOOTSTRAP_TOKEN:}}
  crypto:
    suite: ${NEXUS_CRYPTO_SUITE:INTERNATIONAL}
    key-source: ${NEXUS_CRYPTO_KEY_SOURCE:ephemeral}
    key-id: ${NEXUS_CRYPTO_KEY_ID:local}
    key-version: ${NEXUS_CRYPTO_KEY_VERSION:1}
    master-key: ${NEXUS_CRYPTO_MASTER_KEY:}
  audit:
    persistence: ${NEXUS_AUDIT_PERSISTENCE:memory}

info:
  app:
    name: NexusOne
    work-package: M0-01
    spring-boot: "4.1.1"
    java: "21"
    flyway-pin: "13.7.0"

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    one.nexus: INFO
