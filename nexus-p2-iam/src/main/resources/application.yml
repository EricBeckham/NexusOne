nexus:
  iam:
    persistence: ${NEXUS_IAM_PERSISTENCE:memory}
    idp: ${NEXUS_IAM_IDP:stub}
    context-ttl: PT8H
    jdbc:
      url: ${NEXUS_DB_URL:jdbc:postgresql://127.0.0.1:5432/nexusone}
      username: ${NEXUS_DB_USER:postgres}
      password: ${NEXUS_DB_PASSWORD:}
    keycloak:
      issuer: ${NEXUS_KEYCLOAK_ISSUER:http://127.0.0.1:8080/realms/nexus}
      client-id: ${NEXUS_KEYCLOAK_CLIENT_ID:nexus-platform}
      client-secret: ${NEXUS_KEYCLOAK_CLIENT_SECRET:}
      redirect-uri: ${NEXUS_KEYCLOAK_REDIRECT_URI:http://127.0.0.1:8080/api/v1/auth/callback}
    smtp:
      enabled: ${NEXUS_IAM_SMTP_ENABLED:false}
    platform-bootstrap-token: ${NEXUS_PLATFORM_BOOTSTRAP_TOKEN:}
    mfa:
      # ARCH-CMP-001 / P1-M05-G01-F006 / P2-M09-G04-F005: admin MFA default forced.
      admin-required: ${NEXUS_IAM_MFA_ADMIN_REQUIRED:true}
      platform-tenant-id: ${NEXUS_IAM_PLATFORM_TENANT_ID:01900000-0000-7000-8000-000000000001}
      admin-position-codes: ${NEXUS_IAM_MFA_ADMIN_POSITION_CODES:TENANT_ADMIN,PLATFORM_ADMIN,SYSTEM_ADMIN,SECURITY_ADMIN,AUDIT_ADMIN}
