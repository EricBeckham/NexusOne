nexus:
  iam:
    persistence: memory
    idp: stub
    platform-bootstrap-token: test-bootstrap
  permission:
    persistence: memory
  flow:
    engine: flowable-7.1.0-in-process

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform
    default-schema: platform
    table: flyway_schema_history
    create-schemas: true
  sql:
    init:
      mode: never
