name: s0-secret-rotate-getenv-leftover-honesty

# Honesty gate for SecretPort rotate / getenv / LocalThenEnv leftover beyond #223 / #180 / #200.
# Does not restart a JVM. Does not redo #143/#180/#200/#223.
# Not product S0 / SecretPort close.

on:
  push:
    paths:
      - "scripts/s0-secret-rotate-getenv-leftover-honesty.sh"
      - "scripts/s0-secret-rotate-getenv-leftover-honesty/**"
      - ".github/workflows/s0-secret-rotate-getenv-leftover-honesty.yml"
      - "docs/s0-secret-rotate-getenv-leftover-honesty.md"
      - "docs/engineering/s0-secret-rotate-getenv-leftover-honesty-EVIDENCE.md"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretRotateGetenvLeftoverHonesty.java"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretRotateGetenvLeftoverHonestyTest.java"
  pull_request:
    paths:
      - "scripts/s0-secret-rotate-getenv-leftover-honesty.sh"
      - "scripts/s0-secret-rotate-getenv-leftover-honesty/**"
      - ".github/workflows/s0-secret-rotate-getenv-leftover-honesty.yml"
      - "docs/s0-secret-rotate-getenv-leftover-honesty.md"
      - "docs/engineering/s0-secret-rotate-getenv-leftover-honesty-EVIDENCE.md"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretRotateGetenvLeftoverHonesty.java"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretRotateGetenvLeftoverHonestyTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/s0-secret-rotate-getenv-leftover-honesty.sh --verify-report scripts/s0-secret-rotate-getenv-leftover-honesty/fixtures/honest-skip.env
      - name: Fake OS getenv PASS without a walk is rejected
        run: |
          set +e
          ./scripts/s0-secret-rotate-getenv-leftover-honesty.sh --verify-report \
            scripts/s0-secret-rotate-getenv-leftover-honesty/fixtures/fake-os-getenv-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live_os_getenv_rotate=PASS without os_getenv_mutable=true to fail"
            exit 1
          fi
          echo "PASS: fake OS getenv PASS rejected"
      - name: Fake live restart PASS without a walk is rejected
        run: |
          set +e
          ./scripts/s0-secret-rotate-getenv-leftover-honesty.sh --verify-report \
            scripts/s0-secret-rotate-getenv-leftover-honesty/fixtures/fake-live-restart-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live_restart=PASS without live_restart_observed=true to fail"
            exit 1
          fi
          echo "PASS: fake live restart PASS rejected"
      - name: Fake LocalThenEnv.system PASS without a walk is rejected
        run: |
          set +e
          ./scripts/s0-secret-rotate-getenv-leftover-honesty.sh --verify-report \
            scripts/s0-secret-rotate-getenv-leftover-honesty/fixtures/fake-local-then-env-system-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live_local_then_env_system_getenv=PASS without observation to fail"
            exit 1
          fi
          echo "PASS: fake LocalThenEnv.system PASS rejected"
      - name: Fake product S0 / SecretPort close is rejected
        run: |
          set +e
          ./scripts/s0-secret-rotate-getenv-leftover-honesty.sh --verify-report \
            scripts/s0-secret-rotate-getenv-leftover-honesty/fixtures/fake-s0-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake s0_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake S0 close rejected"
      - name: Fake #180/#200/#223 redo is rejected
        run: |
          set +e
          ./scripts/s0-secret-rotate-getenv-leftover-honesty.sh --verify-report \
            scripts/s0-secret-rotate-getenv-leftover-honesty/fixtures/fake-redone.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake redo_180/redo_200/redo_223 to fail"
            exit 1
          fi
          echo "PASS: fake redo rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest parent harness PASS / LocalThenEnv PASS / live SKIP
        run: |
          chmod +x ./scripts/s0-secret-rotate-getenv-leftover-honesty.sh
          ./scripts/s0-secret-rotate-getenv-leftover-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty"
          ./scripts/s0-secret-rotate-getenv-leftover-honesty.sh \
            --verify-report "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^leftover_223_harness=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^leftover_180_harness=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^leftover_200_harness=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^env_map_rotate=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^local_then_env_map_rotate=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^local_then_env_overlay_wins=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^live_os_getenv_rotate=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^live_restart=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^live_local_then_env_system_getenv=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^live_jdbc_runtime_secretport=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^live_s3_client_rotate=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^s0_close=NOT_CLAIMED$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^secret_port_close=NOT_CLAIMED$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E 's0-secret-rotate-getenv-remainder-honesty' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E 'g7-withdraw-browser-evidence-honesty' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E 'g4-hot-purge-staging-leftover-honesty' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^redo_223=false$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0-secret-rotate-getenv-leftover-honesty
          path: ${{ runner.temp }}/s0-secret-rotate-getenv-leftover-honesty
