name: g17-separation-leftover-honesty

# Honesty leftover beyond #99/#187: admin force vs dual-control PASS/SKIP.
# After G2+G4 on main (including #204 / #205 / #188 / #209 / #214). Does not start a product JAR.
# Does not redo #96/#99/#187. Not product G17 / SoD / dual-control close.

on:
  push:
    paths:
      - "scripts/g17-separation-leftover-honesty.sh"
      - "scripts/g17-separation-leftover-honesty/**"
      - ".github/workflows/g17-separation-leftover-honesty.yml"
      - "docs/g17-separation-leftover-honesty.md"
      - "docs/engineering/g17-separation-leftover-honesty-EVIDENCE.md"
      - "docs/engineering/g17-separation-honesty/agent-vm.env"
      - "docs/README.md"
  pull_request:
    paths:
      - "scripts/g17-separation-leftover-honesty.sh"
      - "scripts/g17-separation-leftover-honesty/**"
      - ".github/workflows/g17-separation-leftover-honesty.yml"
      - "docs/g17-separation-leftover-honesty.md"
      - "docs/engineering/g17-separation-leftover-honesty-EVIDENCE.md"
      - "docs/engineering/g17-separation-honesty/agent-vm.env"
      - "docs/README.md"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g17-separation-leftover-honesty.sh --verify-report \
          scripts/g17-separation-leftover-honesty/fixtures/honest-skip.env
      - name: Fake live admin-force PASS without a walk is rejected
        run: ./scripts/g17-separation-leftover-honesty.sh --verify-report \
          scripts/g17-separation-leftover-honesty/fixtures/fake-live-admin-force-pass.env fail
      - name: Fake live dual-control PASS without a walk is rejected
        run: ./scripts/g17-separation-leftover-honesty.sh --verify-report \
          scripts/g17-separation-leftover-honesty/fixtures/fake-live-dual-control-pass.env fail
      - name: Fake product G17 / SoD close is rejected
        run: ./scripts/g17-separation-leftover-honesty.sh --verify-report \
          scripts/g17-separation-leftover-honesty/fixtures/fake-g17-close.env fail
      - name: Fake product dual-control close is rejected
        run: ./scripts/g17-separation-leftover-honesty.sh --verify-report \
          scripts/g17-separation-leftover-honesty/fixtures/fake-dual-control-close.env fail
      - name: Fake #99/#187 redo is rejected
        run: ./scripts/g17-separation-leftover-honesty.sh --verify-report \
          scripts/g17-separation-leftover-honesty/fixtures/fake-redo.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest admin-force / dual-control SKIP
        run: |
          chmod +x ./scripts/g17-separation-leftover-honesty.sh
          ./scripts/g17-separation-leftover-honesty.sh \
            --out "$RUNNER_TEMP/g17-separation-leftover-honesty"
          ./scripts/g17-separation-leftover-honesty.sh \
            --verify-report "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_99_cells_honest=PASS$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_187_cells_honest=PASS$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^catalog_99_inventory=PASS$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^no_admin_force_bypass_api=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^surfaceguard_still_required=PASS$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^g4_deny_on_chain_unchanged=PASS$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^same_tx_append_unchanged=PASS$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^live_admin_force_walk=SKIP$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^live_dual_control_walk=SKIP$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^live_admin_force_observed=false$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^live_dual_control_observed=false$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^g17_close=NOT_CLAIMED$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^g17_sod_close=NOT_CLAIMED$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^product_dual_control_close=NOT_CLAIMED$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_99_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_187_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_197_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_204_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_205_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_188_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_209_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_217_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_210_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_215_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^leftover_220_kept=true$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^redo_99=false$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^redo_187=false$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g17-separation-leftover-honesty/report.env"
          grep -F 'g9-redis-down-invalidate-remainder' docs/README.md
          grep -F 'g2-h5-every-page-form-write-honesty' docs/README.md
          grep -F 'g17-mfa-recovery-vue-otp-honesty' docs/README.md
          grep -F 'g2-ops-pg-dump-honesty' docs/README.md
          grep -F 'g9-sentinel-cluster-remainder-honesty' docs/README.md
          grep -F 'g5-publishhook-ddl-honesty' docs/README.md
          grep -F 'g17-gm-tls-nginx-handshake-honesty' docs/README.md
          grep -F 'g1-queryast-export-honesty' docs/README.md
          grep -F 'g15-wx-dt-native-bridge-remainder' docs/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g17-separation-leftover-honesty
          path: ${{ runner.temp }}/g17-separation-leftover-honesty
