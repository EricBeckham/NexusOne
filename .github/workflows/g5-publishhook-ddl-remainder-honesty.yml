name: g5-publishhook-ddl-remainder-honesty

# Honesty gate for the G5 PublishHook / real SchemaService DDL publish
# remainder leftover beyond #217/#196/#171/#145. Does not start live PG 15
# or a product JAR. Does not redo #94 / #145 / #171 / #196 / #217.
# Not product G5 close.

on:
  push:
    paths:
      - "scripts/g5-publishhook-ddl-remainder-honesty.sh"
      - "scripts/g5-publishhook-ddl-remainder-honesty/**"
      - ".github/workflows/g5-publishhook-ddl-remainder-honesty.yml"
      - "docs/g5-publishhook-ddl-remainder-honesty.md"
      - "docs/engineering/g5-publishhook-ddl-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"
  pull_request:
    paths:
      - "scripts/g5-publishhook-ddl-remainder-honesty.sh"
      - "scripts/g5-publishhook-ddl-remainder-honesty/**"
      - ".github/workflows/g5-publishhook-ddl-remainder-honesty.yml"
      - "docs/g5-publishhook-ddl-remainder-honesty.md"
      - "docs/engineering/g5-publishhook-ddl-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g5-publishhook-ddl-remainder-honesty.sh --verify-report \
          scripts/g5-publishhook-ddl-remainder-honesty/fixtures/honest-skip.env
      - name: Fake live real-DDL publish PASS without a walk is rejected
        run: ./scripts/g5-publishhook-ddl-remainder-honesty.sh --verify-report \
          scripts/g5-publishhook-ddl-remainder-honesty/fixtures/fake-live-ddl-publish-pass.env fail
      - name: Fake PublishHook publish PASS without a walk is rejected
        run: ./scripts/g5-publishhook-ddl-remainder-honesty.sh --verify-report \
          scripts/g5-publishhook-ddl-remainder-honesty/fixtures/fake-publishhook-publish-pass.env fail
      - name: Fake #217-abort-as-live-publish is rejected
        run: ./scripts/g5-publishhook-ddl-remainder-honesty.sh --verify-report \
          scripts/g5-publishhook-ddl-remainder-honesty/fixtures/fake-217-abort-as-publish.env fail
      - name: Fake confirm-only-as-real-DDL-publish is rejected
        run: ./scripts/g5-publishhook-ddl-remainder-honesty.sh --verify-report \
          scripts/g5-publishhook-ddl-remainder-honesty/fixtures/fake-confirm-only-as-publish.env fail
      - name: Fake product G5 close is rejected
        run: ./scripts/g5-publishhook-ddl-remainder-honesty.sh --verify-report \
          scripts/g5-publishhook-ddl-remainder-honesty/fixtures/fake-g5-close.env fail
      - name: Fake #217 redo is rejected
        run: ./scripts/g5-publishhook-ddl-remainder-honesty.sh --verify-report \
          scripts/g5-publishhook-ddl-remainder-honesty/fixtures/fake-redone.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live real-DDL publish SKIP
        run: |
          chmod +x ./scripts/g5-publishhook-ddl-remainder-honesty.sh
          ./scripts/g5-publishhook-ddl-remainder-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty"
          ./scripts/g5-publishhook-ddl-remainder-honesty.sh \
            --verify-report "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^honesty_217_contract=PASS$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^honesty_217_abort_skip_is_not_live_publish=true$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^memory_harness_is_not_real_ddl_publish=true$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^confirm_only_is_not_real_ddl_publish=true$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^confirm_then_abort_wrapper_is_not_real_ddl_publish=true$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^zonky_create_evolve_success_is_not_live_publish=true$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^live_real_ddl_publish=SKIP$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^live_publishhook_publish=SKIP$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^g5_close=NOT_CLAIMED$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^leftover_rows_all=true$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^redone_94=false$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^redone_145=false$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^redone_171=false$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^redone_196=false$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^redone_217=false$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g5-publishhook-ddl-remainder-honesty/report.env"
          grep -F 'g5-publishhook-ddl-honesty' docs/README.md
          grep -F 'g5-mid-publish-failure-honesty' docs/README.md
          grep -F 'g10-leftover-honesty-remainder' docs/README.md
          grep -F 'g3-outbox-consume-idempotent-honesty' docs/README.md
          grep -F 'g9-live-multi-jvm-replica-remainder-honesty' docs/README.md
          grep -F 'g4-hot-purge-staging-leftover-honesty' docs/README.md
          grep -F 'g7-withdraw-browser-evidence-honesty' docs/README.md
          grep -F 'g2-h5-every-page-form-write-remainder-honesty' docs/README.md
          grep -F 'g9-redis-down-invalidate-remainder-honesty' docs/README.md
          grep -F 'g7-query-expense-travel-honesty-remainder' docs/README.md
          grep -F 'g1-fieldpolicy-mask-second-auth-remainder-honesty' docs/README.md
          grep -F 'g17-mfa-recovery-vue-otp-remainder-honesty' docs/README.md
          grep -F 'g2-report-physical-dump-honesty' docs/README.md
          grep -F 'g6-recovery-port-dry-run-remainder-honesty' docs/README.md
          grep -F 'g5-publishhook-ddl-remainder-honesty' docs/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-publishhook-ddl-remainder-honesty
          path: ${{ runner.temp }}/g5-publishhook-ddl-remainder-honesty
