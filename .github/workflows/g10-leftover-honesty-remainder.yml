name: g10-leftover-honesty-remainder

# Honesty leftover remainder beyond #202/#169/#179/#141.
# Does not re-run g10-leftover-honesty.sh collect or #141/#169/#179 scripts.
# Parent leftover honesty fixtures stay PASS.
# Live MinIO / Keycloak stay SKIP unless present AND observed.
# Product G10 is not closed.

on:
  push:
    paths:
      - "scripts/g10-leftover-honesty-remainder.sh"
      - "scripts/g10-leftover-honesty-remainder/**"
      - "docs/g10-leftover-honesty-remainder.md"
      - "docs/engineering/g10-leftover-honesty-remainder-EVIDENCE.md"
      - "docs/engineering/g10-leftover-honesty/agent-vm.env"
      - "docs/engineering/g10-file-reconcile-honesty/agent-vm.env"
      - "docs/engineering/g10-identity-drift-honesty/agent-vm.env"
      - "docs/README.md"
      - ".github/workflows/g10-leftover-honesty-remainder.yml"
  pull_request:
    paths:
      - "scripts/g10-leftover-honesty-remainder.sh"
      - "scripts/g10-leftover-honesty-remainder/**"
      - "docs/g10-leftover-honesty-remainder.md"
      - "docs/engineering/g10-leftover-honesty-remainder-EVIDENCE.md"
      - "docs/engineering/g10-leftover-honesty/agent-vm.env"
      - "docs/engineering/g10-file-reconcile-honesty/agent-vm.env"
      - "docs/engineering/g10-identity-drift-honesty/agent-vm.env"
      - "docs/README.md"
      - ".github/workflows/g10-leftover-honesty-remainder.yml"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g10-leftover-honesty-remainder.sh --verify-report scripts/g10-leftover-honesty-remainder/fixtures/honest-skip.env
      - name: Fake live MinIO PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g10-leftover-honesty-remainder.sh --verify-report \
            scripts/g10-leftover-honesty-remainder/fixtures/fake-live-minio-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live MinIO PASS without live_minio_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live MinIO PASS rejected"
      - name: Fake live Keycloak PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g10-leftover-honesty-remainder.sh --verify-report \
            scripts/g10-leftover-honesty-remainder/fixtures/fake-live-keycloak-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live Keycloak PASS without live_keycloak_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live Keycloak PASS rejected"
      - name: Fake live apply PASS is rejected
        run: |
          set +e
          ./scripts/g10-leftover-honesty-remainder.sh --verify-report \
            scripts/g10-leftover-honesty-remainder/fixtures/fake-live-apply-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live apply PASS to fail"
            exit 1
          fi
          echo "PASS: fake live apply PASS rejected"
      - name: Fake product G10 close is rejected
        run: |
          set +e
          ./scripts/g10-leftover-honesty-remainder.sh --verify-report \
            scripts/g10-leftover-honesty-remainder/fixtures/fake-g10-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g10_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G10 close rejected"
      - name: Fake #202 redo is rejected
        run: |
          set +e
          ./scripts/g10-leftover-honesty-remainder.sh --verify-report \
            scripts/g10-leftover-honesty-remainder/fixtures/fake-redone.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake leftover_202_redone=true to fail"
            exit 1
          fi
          echo "PASS: fake #202 redo rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live MinIO / Keycloak SKIP
        run: |
          chmod +x ./scripts/g10-leftover-honesty-remainder.sh
          ./scripts/g10-leftover-honesty-remainder.sh \
            --out "$RUNNER_TEMP/g10-leftover-honesty-remainder"
          ./scripts/g10-leftover-honesty-remainder.sh \
            --verify-report "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_169_cells_honest=PASS$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_179_cells_honest=PASS$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_202_cells_honest=PASS$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_202_honesty_gate=PASS$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^counting_preview_apply=PASS$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^tenant_prefix_guard=PASS$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^dry_run_default_no_write=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^live_minio_reconcile=SKIP$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^live_keycloak_8080=SKIP$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^live_apply=SKIP$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^live_preview_observed=false$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^live_dry_run_observed=false$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^g10_close=NOT_CLAIMED$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 'g10-leftover-honesty' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 'g10-file-reconcile-honesty' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 'g10-identity-drift-honesty' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 'g17-separation-leftover-honesty' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 'g4-pkce-spa-verifier-remainder-honesty' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 's0-secret-rotate-getenv-remainder-honesty' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 'g6-recovery-port-dry-run-remainder-honesty' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 'g2-report-physical-dump-honesty' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 'g15-wx-dt-native-bridge-remainder' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E 'g1-queryast-export-honesty' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_202_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_216_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_222_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_223_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_225_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_221_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_220_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_215_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^identity_drift_141_redone=false$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^file_reconcile_169_redone=false$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^identity_drift_179_redone=false$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^leftover_202_redone=false$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g10-leftover-honesty-remainder/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-leftover-honesty-remainder
          path: ${{ runner.temp }}/g10-leftover-honesty-remainder
