name: g10-file-reconcile-honesty

# Honesty gate for the G10 file metadata ↔ object reconcile leftover.
# Does not start MinIO. Does not redo #141 identity drift or G6 restore.
# Not product G10 close.

on:
  push:
    paths:
      - "scripts/g10-file-reconcile-honesty.sh"
      - "scripts/g10-file-reconcile-honesty/**"
      - ".github/workflows/g10-file-reconcile-honesty.yml"
      - "docs/g10-file-reconcile-honesty.md"
      - "docs/engineering/g10-file-reconcile-honesty-EVIDENCE.md"
      - "nexus-file-core/src/main/java/one/nexus/file/G10FileReconcileHonesty.java"
      - "nexus-file-core/src/test/java/one/nexus/file/G10FileReconcileHonestyTest.java"
  pull_request:
    paths:
      - "scripts/g10-file-reconcile-honesty.sh"
      - "scripts/g10-file-reconcile-honesty/**"
      - ".github/workflows/g10-file-reconcile-honesty.yml"
      - "docs/g10-file-reconcile-honesty.md"
      - "docs/engineering/g10-file-reconcile-honesty-EVIDENCE.md"
      - "nexus-file-core/src/main/java/one/nexus/file/G10FileReconcileHonesty.java"
      - "nexus-file-core/src/test/java/one/nexus/file/G10FileReconcileHonestyTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g10-file-reconcile-honesty.sh --verify-report scripts/g10-file-reconcile-honesty/fixtures/honest-skip.env
      - name: Fake live MinIO PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g10-file-reconcile-honesty.sh --verify-report \
            scripts/g10-file-reconcile-honesty/fixtures/fake-live-minio-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live MinIO PASS without live_minio_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live MinIO PASS rejected"
      - name: Fake product G10 close is rejected
        run: |
          set +e
          ./scripts/g10-file-reconcile-honesty.sh --verify-report \
            scripts/g10-file-reconcile-honesty/fixtures/fake-g10-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g10_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G10 close rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live MinIO SKIP
        run: |
          chmod +x ./scripts/g10-file-reconcile-honesty.sh
          ./scripts/g10-file-reconcile-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g10-file-reconcile-honesty"
          ./scripts/g10-file-reconcile-honesty.sh \
            --verify-report "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
          grep -E '^live_minio_reconcile=SKIP$' "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
          grep -E '^live_preview_observed=false$' "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
          grep -E '^live_apply_observed=false$' "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
          grep -E '^g10_close=NOT_CLAIMED$' "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
          grep -E '^identity_drift_141_redone=false$' "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
          grep -E '^g6_object_restore_redone=false$' "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g10-file-reconcile-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-file-reconcile-honesty
          path: ${{ runner.temp }}/g10-file-reconcile-honesty
