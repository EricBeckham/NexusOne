name: linux-arm-profile-remainder-honesty

# Honesty gate for the Linux/ARM (or non-x86) platform-matrix remainder
# leftover beyond #193/#157. Does not boot a product JAR.
# Does not redo #105/#127/#157/#193. Not product Profile close.

on:
  push:
    paths:
      - "scripts/linux-arm-profile-remainder-honesty.sh"
      - "scripts/linux-arm-profile-remainder-honesty/**"
      - "poc/p0-10/deployment-matrix.csv"
      - "poc/p0-10/supply-chain-evidence.csv"
      - "docs/linux-arm-profile-remainder-honesty.md"
      - "docs/engineering/linux-arm-profile-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"
      - ".github/workflows/linux-arm-profile-remainder-honesty.yml"
  pull_request:
    paths:
      - "scripts/linux-arm-profile-remainder-honesty.sh"
      - "scripts/linux-arm-profile-remainder-honesty/**"
      - "poc/p0-10/deployment-matrix.csv"
      - "poc/p0-10/supply-chain-evidence.csv"
      - "docs/linux-arm-profile-remainder-honesty.md"
      - "docs/engineering/linux-arm-profile-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"
      - ".github/workflows/linux-arm-profile-remainder-honesty.yml"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/linux-arm-profile-remainder-honesty.sh --verify-report \
          scripts/linux-arm-profile-remainder-honesty/fixtures/honest-skip.env
      - name: Fake live ARM/Linux product-JAR PASS is rejected
        run: ./scripts/linux-arm-profile-remainder-honesty.sh --verify-report \
          scripts/linux-arm-profile-remainder-honesty/fixtures/fake-live-arm-jar-pass.env fail
      - name: Fake live non-x86 product-JAR PASS is rejected
        run: ./scripts/linux-arm-profile-remainder-honesty.sh --verify-report \
          scripts/linux-arm-profile-remainder-honesty/fixtures/fake-live-non-x86-pass.env fail
      - name: Fake QEMU-as-ARM PASS is rejected
        run: ./scripts/linux-arm-profile-remainder-honesty.sh --verify-report \
          scripts/linux-arm-profile-remainder-honesty/fixtures/fake-qemu-as-arm.env fail
      - name: Fake x86-as-ARM PASS is rejected
        run: ./scripts/linux-arm-profile-remainder-honesty.sh --verify-report \
          scripts/linux-arm-profile-remainder-honesty/fixtures/fake-x86-as-arm.env fail
      - name: Fake Profile close is rejected
        run: ./scripts/linux-arm-profile-remainder-honesty.sh --verify-report \
          scripts/linux-arm-profile-remainder-honesty/fixtures/fake-profile-close.env fail
      - name: Fake #193 redo is rejected
        run: ./scripts/linux-arm-profile-remainder-honesty.sh --verify-report \
          scripts/linux-arm-profile-remainder-honesty/fixtures/fake-redone.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest platform-matrix PASS / live ARM JAR SKIP
        run: |
          chmod +x ./scripts/linux-arm-profile-remainder-honesty.sh
          ./scripts/linux-arm-profile-remainder-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/linux-arm-profile-remainder-honesty"
          ./scripts/linux-arm-profile-remainder-honesty.sh \
            --verify-report "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_157_harness=PASS$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_193_harness=PASS$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^platform_matrix_inventory=PASS$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^target_arm_01_status=not-tested$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^target_x86_01_status=not-tested$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^supply_chain_status=not-collected$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^live_arm_linux_product_jar=SKIP$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^live_non_x86_product_jar=SKIP$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^x86_note_extrapolated=false$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^x86_agent_vm_is_not_arm_linux_jar=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^qemu_used=false$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^docker_used=false$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^profile_acceptance=NOT_CLAIMED$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_rows_all=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^redone_157=false$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^redone_193=false$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -F 'linux-arm-profile-honesty' docs/README.md
          grep -F 'linux-arm-profile-leftover-honesty' docs/README.md
          grep -F 'linux-arm-profile-remainder-honesty' docs/README.md
          grep -F 'g3-outbox-consume-idempotent-honesty' docs/README.md
          grep -F 'g10-leftover-honesty-remainder' docs/README.md
          grep -F 'g2-report-physical-dump-honesty' docs/README.md
          grep -F 'g6-recovery-port-dry-run-remainder-honesty' docs/README.md
          grep -F 'g9-live-multi-jvm-replica-remainder-honesty' docs/README.md
          grep -F 'g4-hot-purge-staging-leftover-honesty' docs/README.md
          grep -F 'g7-withdraw-browser-evidence-honesty' docs/README.md
          grep -F 'g2-h5-every-page-form-write-remainder-honesty' docs/README.md
          grep -F 'g9-redis-down-invalidate-remainder-honesty' docs/README.md
          grep -F 'g7-query-expense-travel-honesty-remainder' docs/README.md
          grep -F 'g1-fieldpolicy-mask-second-auth-remainder-honesty' docs/README.md
          grep -F 'g17-mfa-recovery-vue-otp-remainder-honesty' docs/README.md
          grep -F 'g5-publishhook-ddl-remainder-honesty' docs/README.md
          grep -F 's0-secret-rotate-getenv-leftover-honesty' docs/README.md
          grep -F 'g10-file-object-reconcile-remainder-honesty' docs/README.md
          grep -F 'g4-hot-purge-staging-pkce-remainder-honesty' docs/README.md
          grep -E '^leftover_251_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_243_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_241_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_235_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_233_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_238_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_239_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_237_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_232_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_212_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_229_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
          grep -E '^leftover_230_kept=true$' "$RUNNER_TEMP/linux-arm-profile-remainder-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm-profile-remainder-honesty
          path: ${{ runner.temp }}/linux-arm-profile-remainder-honesty
