name: g10-leftover-honesty

# Honesty leftover beyond #169/#179.
# Does not re-run g10-file-reconcile-honesty.sh or g10-identity-drift-honesty.sh.
# Live MinIO / Keycloak stay SKIP unless present AND observed.
# Product G10 is not closed.

on:
  push:
    paths:
      - "scripts/g10-leftover-honesty.sh"
      - "scripts/g10-leftover-honesty/**"
      - "docs/g10-leftover-honesty.md"
      - "docs/engineering/g10-leftover-honesty-EVIDENCE.md"
      - "docs/engineering/g10-file-reconcile-honesty/agent-vm.env"
      - "docs/engineering/g10-identity-drift-honesty/agent-vm.env"
      - "docs/README.md"
      - ".github/workflows/g10-leftover-honesty.yml"
  pull_request:
    paths:
      - "scripts/g10-leftover-honesty.sh"
      - "scripts/g10-leftover-honesty/**"
      - "docs/g10-leftover-honesty.md"
      - "docs/engineering/g10-leftover-honesty-EVIDENCE.md"
      - "docs/engineering/g10-file-reconcile-honesty/agent-vm.env"
      - "docs/engineering/g10-identity-drift-honesty/agent-vm.env"
      - "docs/README.md"
      - ".github/workflows/g10-leftover-honesty.yml"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g10-leftover-honesty.sh --verify-report scripts/g10-leftover-honesty/fixtures/honest-skip.env
      - name: Fake live MinIO PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g10-leftover-honesty.sh --verify-report \
            scripts/g10-leftover-honesty/fixtures/fake-live-minio-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live MinIO PASS without live_minio_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live MinIO PASS rejected"
      - name: Fake live Keycloak PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g10-leftover-honesty.sh --verify-report \
            scripts/g10-leftover-honesty/fixtures/fake-live-keycloak-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live Keycloak PASS without live_keycloak_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live Keycloak PASS rejected"
      - name: Fake live apply PASS is rejected
        run: |
          set +e
          ./scripts/g10-leftover-honesty.sh --verify-report \
            scripts/g10-leftover-honesty/fixtures/fake-live-apply-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live apply PASS to fail"
            exit 1
          fi
          echo "PASS: fake live apply PASS rejected"
      - name: Fake product G10 close is rejected
        run: |
          set +e
          ./scripts/g10-leftover-honesty.sh --verify-report \
            scripts/g10-leftover-honesty/fixtures/fake-g10-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g10_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G10 close rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live MinIO / Keycloak SKIP
        run: |
          chmod +x ./scripts/g10-leftover-honesty.sh
          ./scripts/g10-leftover-honesty.sh \
            --out "$RUNNER_TEMP/g10-leftover-honesty"
          ./scripts/g10-leftover-honesty.sh \
            --verify-report "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_169_cells_honest=PASS$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_179_cells_honest=PASS$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^counting_preview_apply=PASS$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^tenant_prefix_guard=PASS$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^dry_run_default_no_write=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^live_minio_reconcile=SKIP$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^live_keycloak_8080=SKIP$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^live_apply=SKIP$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^live_preview_observed=false$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^live_dry_run_observed=false$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^g10_close=NOT_CLAIMED$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E 'g10-file-reconcile-honesty' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E 'g10-identity-drift-honesty' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E 'g7-query-expense-travel-honesty' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E 'linux-arm-profile-leftover-honesty' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E 'g15-wx-dt-native-bridge-honesty' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E 's0-secret-rotate-without-restart-honesty' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E 'g1-queryast-boundsql-honesty' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E 'g3-outbox-consume-crash-honesty' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E 'g5-mid-publish-failure-honesty' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_169_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_179_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_191_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_192_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_193_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_195_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_196_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_198_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^leftover_200_kept=true$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^identity_drift_141_redone=false$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^file_reconcile_169_redone=false$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^identity_drift_179_redone=false$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g10-leftover-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-leftover-honesty
          path: ${{ runner.temp }}/g10-leftover-honesty
