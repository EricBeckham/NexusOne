name: g1-queryast-export-honesty

# Honesty leftover beyond #191/#146.
# Does not re-run g1-queryast-boundsql-honesty.sh or #134/#146 suites.
# Live BoundSql / IsolatedExport stay SKIP unless present AND observed.
# Product G1 is not closed.

on:
  push:
    paths:
      - "scripts/g1-queryast-export-honesty.sh"
      - "scripts/g1-queryast-export-honesty/**"
      - "docs/g1-queryast-export-honesty.md"
      - "docs/engineering/g1-queryast-export-honesty-EVIDENCE.md"
      - "docs/README.md"
      - ".github/workflows/g1-queryast-export-honesty.yml"
  pull_request:
    paths:
      - "scripts/g1-queryast-export-honesty.sh"
      - "scripts/g1-queryast-export-honesty/**"
      - "docs/g1-queryast-export-honesty.md"
      - "docs/engineering/g1-queryast-export-honesty-EVIDENCE.md"
      - "docs/README.md"
      - ".github/workflows/g1-queryast-export-honesty.yml"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g1-queryast-export-honesty.sh --verify-report scripts/g1-queryast-export-honesty/fixtures/honest-skip.env
      - name: Fake live BoundSql PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g1-queryast-export-honesty.sh --verify-report \
            scripts/g1-queryast-export-honesty/fixtures/fake-live-boundsql-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live BoundSql PASS without live_jar_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live BoundSql PASS rejected"
      - name: Fake live export drop PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g1-queryast-export-honesty.sh --verify-report \
            scripts/g1-queryast-export-honesty/fixtures/fake-live-export-drop-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live export drop PASS without live_jar_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live export drop PASS rejected"
      - name: Fake product G1 close is rejected
        run: |
          set +e
          ./scripts/g1-queryast-export-honesty.sh --verify-report \
            scripts/g1-queryast-export-honesty/fixtures/fake-g1-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g1_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G1 close rejected"
      - name: Fake unguarded raw BoundSql is rejected
        run: |
          set +e
          ./scripts/g1-queryast-export-honesty.sh --verify-report \
            scripts/g1-queryast-export-honesty/fixtures/fake-raw-boundsql.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake raw BoundSql / unguarded leftover to fail"
            exit 1
          fi
          echo "PASS: fake raw BoundSql rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest leftover BoundSql/COUNT/export drop PASS / live SKIP
        run: |
          chmod +x ./scripts/g1-queryast-export-honesty.sh
          ./scripts/g1-queryast-export-honesty.sh \
            --out "$RUNNER_TEMP/g1-queryast-export-honesty"
          ./scripts/g1-queryast-export-honesty.sh \
            --verify-report "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_134_cells_honest=PASS$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_146_cells_honest=PASS$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_191_cells_honest=PASS$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_boundsql_guard=PASS$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_count_guard=PASS$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_export_hidden_drop=PASS$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^raw_boundsql_rejected=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^count_is_ast_node=false$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^isolated_export_applies_mask=false$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^live_boundsql_count=SKIP$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^live_export_fieldpolicy_drop=SKIP$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^live_boundsql_list_observed=false$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^live_export_drop_observed=false$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^g1_close=NOT_CLAIMED$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E 'g1-queryast-boundsql-honesty' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E 'g1-export-fieldpolicy-drop' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E 'g2-h5-every-page-form-write-honesty' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E 'g9-redis-down-invalidate-remainder' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E 'g17-mfa-recovery-vue-otp-honesty' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E 'g2-ops-pg-dump-honesty' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E 'g9-sentinel-cluster-remainder-honesty' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E 'g5-publishhook-ddl-honesty' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E 'g17-gm-tls-nginx-handshake-honesty' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_134_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_146_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_191_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_204_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_197_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_205_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_188_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_209_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_217_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^leftover_210_kept=true$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^redone_134=false$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^redone_146=false$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^redone_191=false$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g1-queryast-export-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-queryast-export-honesty
          path: ${{ runner.temp }}/g1-queryast-export-honesty
