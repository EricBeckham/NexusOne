name: linux-arm-profile-honesty

# Honesty leftover after #105 / #127.
# Does not re-run collect-and-verify.sh or lifecycle.sh.
# TARGET-ARM-01 stays not-tested. supply-chain-evidence.csv stays not-collected.
# Product Linux/ARM Profile is not accepted.

on:
  push:
    paths:
      - "scripts/linux-arm-profile-honesty.sh"
      - "scripts/linux-arm-profile-honesty/**"
      - "poc/p0-10/deployment-matrix.csv"
      - "poc/p0-10/supply-chain-evidence.csv"
      - "docs/linux-arm-profile-honesty.md"
      - "docs/engineering/linux-arm-profile-honesty-EVIDENCE.md"
      - ".github/workflows/linux-arm-profile-honesty.yml"
  pull_request:
    paths:
      - "scripts/linux-arm-profile-honesty.sh"
      - "scripts/linux-arm-profile-honesty/**"
      - "poc/p0-10/deployment-matrix.csv"
      - "poc/p0-10/supply-chain-evidence.csv"
      - "docs/linux-arm-profile-honesty.md"
      - "docs/engineering/linux-arm-profile-honesty-EVIDENCE.md"
      - ".github/workflows/linux-arm-profile-honesty.yml"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest report is accepted
        run: ./scripts/linux-arm-profile-honesty.sh --verify-report scripts/linux-arm-profile-honesty/fixtures/honest.env
      - name: Fake TARGET-ARM-01 pass is rejected
        run: |
          set +e
          ./scripts/linux-arm-profile-honesty.sh --verify-report scripts/linux-arm-profile-honesty/fixtures/fake-arm-tested.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake TARGET-ARM-01 pass to fail the honesty gate"
            exit 1
          fi
          echo "PASS: fake TARGET-ARM-01 pass rejected"
      - name: Fake supply-chain collected is rejected
        run: |
          set +e
          ./scripts/linux-arm-profile-honesty.sh --verify-report scripts/linux-arm-profile-honesty/fixtures/fake-supply-collected.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake supply-chain collected to fail the honesty gate"
            exit 1
          fi
          echo "PASS: fake supply-chain collected rejected"
      - name: Fake Profile close is rejected
        run: |
          set +e
          ./scripts/linux-arm-profile-honesty.sh --verify-report scripts/linux-arm-profile-honesty/fixtures/fake-profile-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake Profile close to fail the honesty gate"
            exit 1
          fi
          echo "PASS: fake Profile close rejected"
      - name: Fake aarch64 PASS is rejected
        run: |
          set +e
          ./scripts/linux-arm-profile-honesty.sh --verify-report scripts/linux-arm-profile-honesty/fixtures/fake-aarch64-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake aarch64 PASS to fail the honesty gate"
            exit 1
          fi
          echo "PASS: fake aarch64 PASS rejected"
