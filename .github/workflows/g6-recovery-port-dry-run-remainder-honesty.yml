name: g6-recovery-port-dry-run-remainder-honesty

# Honesty gate for the G6 RecoveryPort dry-run / non-product-HA remainder
# leftover beyond #186/#135/#164. Does not start PostgreSQL.
# Does not touch haopan_platform. Does not redo #135/#164/#186.
# Not product G6 / RecoveryPort / HA close.

on:
  push:
    paths:
      - "scripts/g6-recovery-port-dry-run-remainder-honesty.sh"
      - "scripts/g6-recovery-port-dry-run-remainder-honesty/**"
      - ".github/workflows/g6-recovery-port-dry-run-remainder-honesty.yml"
      - "docs/g6-recovery-port-dry-run-remainder-honesty.md"
      - "docs/engineering/g6-recovery-port-dry-run-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"
  pull_request:
    paths:
      - "scripts/g6-recovery-port-dry-run-remainder-honesty.sh"
      - "scripts/g6-recovery-port-dry-run-remainder-honesty/**"
      - ".github/workflows/g6-recovery-port-dry-run-remainder-honesty.yml"
      - "docs/g6-recovery-port-dry-run-remainder-honesty.md"
      - "docs/engineering/g6-recovery-port-dry-run-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh --verify-report \
          scripts/g6-recovery-port-dry-run-remainder-honesty/fixtures/honest-skip.env
      - name: Fake minute-level RPO PASS without a walk is rejected
        run: ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh --verify-report \
          scripts/g6-recovery-port-dry-run-remainder-honesty/fixtures/fake-minute-rpo-pass.env fail
      - name: Fake product HA PASS without a walk is rejected
        run: ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh --verify-report \
          scripts/g6-recovery-port-dry-run-remainder-honesty/fixtures/fake-product-ha-pass.env fail
      - name: Fake live restore PASS without a walk is rejected
        run: ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh --verify-report \
          scripts/g6-recovery-port-dry-run-remainder-honesty/fixtures/fake-live-restore-pass.env fail
      - name: Fake dry-run-as-product-HA is rejected
        run: ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh --verify-report \
          scripts/g6-recovery-port-dry-run-remainder-honesty/fixtures/fake-dry-run-as-ha.env fail
      - name: Fake product G6 close is rejected
        run: ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh --verify-report \
          scripts/g6-recovery-port-dry-run-remainder-honesty/fixtures/fake-g6-close.env fail
      - name: Fake #186 redo is rejected
        run: ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh --verify-report \
          scripts/g6-recovery-port-dry-run-remainder-honesty/fixtures/fake-redone.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest minute-level RPO / live restore SKIP
        run: |
          chmod +x ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh
          ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty"
          ./scripts/g6-recovery-port-dry-run-remainder-honesty.sh \
            --verify-report "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^dry_run_186_contract=PASS$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^dry_run_is_not_live_restore=true$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^ops_drill_is_not_product_ha=true$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^minute_level_rpo=SKIP$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^product_ha=SKIP$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^live_restore=SKIP$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^g6_close=NOT_CLAIMED$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^recovery_port_close=NOT_CLAIMED$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^ha_close=NOT_CLAIMED$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^haopan_platform_touched=false$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^redone_135=false$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^redone_164=false$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^redone_186=false$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^leftover_rows_all=true$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g6-recovery-port-dry-run-remainder-honesty/report.env"
          grep -F 'g6-recovery-port-dry-run-honesty' docs/README.md
          grep -F 's0-secret-rotate-getenv-remainder-honesty' docs/README.md
          grep -F 'g4-pkce-spa-verifier-remainder-honesty' docs/README.md
          grep -F 'g17-separation-leftover-honesty' docs/README.md
          grep -F 'g15-wx-dt-native-bridge-remainder' docs/README.md
          grep -F 'g1-queryast-export-honesty' docs/README.md
          grep -F 'g17-gm-tls-nginx-handshake-honesty' docs/README.md
          grep -F 'g5-publishhook-ddl-honesty' docs/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-recovery-port-dry-run-remainder-honesty
          path: ${{ runner.temp }}/g6-recovery-port-dry-run-remainder-honesty
