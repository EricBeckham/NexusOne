name: g1-fieldpolicy-mask-boundsql-export-remainder-honesty

# Honesty leftover remainder beyond #238/#215/#184.
# Does not re-run g1-fieldpolicy-mask-second-auth-remainder-honesty.sh collect
# or #184/#215 scripts.
# Parent leftover honesty fixtures stay PASS and are NOT a live JAR /
# IsolatedExport mask / BoundSql walk.
# Live JAR / IsolatedExport mask / BoundSql stay SKIP unless present AND observed.
# Product G1 is not closed.

on:
  push:
    paths:
      - "scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh"
      - "scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/**"
      - "docs/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.md"
      - "docs/engineering/g1-fieldpolicy-mask-boundsql-export-remainder-honesty-EVIDENCE.md"
      - "docs/engineering/g1-fieldpolicy-mask-second-auth-remainder-honesty/agent-vm.env"
      - "docs/engineering/g1-queryast-export-honesty/agent-vm.env"
      - "docs/README.md"
      - ".github/workflows/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.yml"
  pull_request:
    paths:
      - "scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh"
      - "scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/**"
      - "docs/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.md"
      - "docs/engineering/g1-fieldpolicy-mask-boundsql-export-remainder-honesty-EVIDENCE.md"
      - "docs/engineering/g1-fieldpolicy-mask-second-auth-remainder-honesty/agent-vm.env"
      - "docs/engineering/g1-queryast-export-honesty/agent-vm.env"
      - "docs/README.md"
      - ".github/workflows/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.yml"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh --verify-report \
          scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/fixtures/honest-skip.env
      - name: Fake live API mask PASS without a walk is rejected
        run: ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh --verify-report \
          scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/fixtures/fake-live-api-mask-pass.env fail
      - name: Fake live IsolatedExport mask PASS without a walk is rejected
        run: ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh --verify-report \
          scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/fixtures/fake-live-export-mask-pass.env fail
      - name: Fake live second-auth PASS without a walk is rejected
        run: ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh --verify-report \
          scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/fixtures/fake-live-second-auth-pass.env fail
      - name: Fake live BoundSql PASS without a walk is rejected
        run: ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh --verify-report \
          scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/fixtures/fake-live-boundsql-pass.env fail
      - name: Fake product G1 close is rejected
        run: ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh --verify-report \
          scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/fixtures/fake-g1-close.env fail
      - name: Fake #238 redo is rejected
        run: ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh --verify-report \
          scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/fixtures/fake-redone.env fail
      - name: Fake #238-harness-as-live-JAR is rejected
        run: ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh --verify-report \
          scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/fixtures/fake-harness-as-live.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest leftover #238/#215/#184 PASS / live SKIP
        run: |
          chmod +x ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh
          ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty"
          ./scripts/g1-fieldpolicy-mask-boundsql-export-remainder-honesty.sh \
            --verify-report "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_162_cells_honest=PASS$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_184_cells_honest=PASS$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_215_cells_honest=PASS$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_238_cells_honest=PASS$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_238_honesty_gate=PASS$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^harness_238_is_not_live_jar=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^harness_238_is_not_live_export_mask=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^harness_238_is_not_product_g1=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^harness_215_is_not_live_jar=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_beside_ast=PASS$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_boundsql_guard=PASS$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_export_hidden_drop=PASS$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^mask_on_ast=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^isolated_export_applies_mask=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^live_api_mask=SKIP$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^live_export_mask=SKIP$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^live_second_auth=SKIP$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^live_boundsql_count=SKIP$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^live_export_fieldpolicy_drop=SKIP$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^live_api_mask_observed=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^g1_close=NOT_CLAIMED$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_184_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_215_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_238_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_262_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_259_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_249_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_240_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_254_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_236_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_251_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_263_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_265_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_256_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_260_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^leftover_243_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^redone_184=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^redone_215=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^redone_238=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-boundsql-export-remainder-honesty/report.env"
          grep -F 'g1-fieldpolicy-mask-second-auth-remainder-honesty' docs/README.md
          grep -F 'g1-queryast-export-honesty' docs/README.md
          grep -F 'g1-fieldpolicy-mask-second-auth-honesty' docs/README.md
          grep -F 'g15-h5-pkce-miniprogram-remainder-honesty' docs/README.md
          grep -F 'g10-file-object-reconcile-leftover-honesty' docs/README.md
          grep -F 'linux-arm-profile-leftover-remainder-honesty' docs/README.md
          grep -F 'g4-hot-purge-staging-pkce-leftover-honesty' docs/README.md
          grep -F 'g7-query-withdraw-leftover-honesty' docs/README.md
          grep -F 'g5-publishhook-ddl-leftover-honesty' docs/README.md
          grep -F 'g9-leftover-honesty-remainder' docs/README.md
          grep -F 'g17-separation-leftover-honesty-remainder' docs/README.md
          grep -F 'g2-h5-every-page-form-write-report-remainder-honesty' docs/README.md
          grep -F 'linux-arm-profile-remainder-honesty' docs/README.md
          grep -F 'g4-hot-purge-staging-pkce-remainder-honesty' docs/README.md
          grep -F 'g10-file-object-reconcile-remainder-honesty' docs/README.md
          grep -F 'g1-fieldpolicy-mask-boundsql-export-remainder-honesty' docs/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-fieldpolicy-mask-boundsql-export-remainder-honesty
          path: ${{ runner.temp }}/g1-fieldpolicy-mask-boundsql-export-remainder-honesty
