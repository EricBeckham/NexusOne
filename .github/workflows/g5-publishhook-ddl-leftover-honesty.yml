name: g5-publishhook-ddl-leftover-honesty

# Honesty leftover remainder beyond #235/#217.
# Does not re-run g5-publishhook-ddl-remainder-honesty.sh or #217 scripts.
# Parent leftover honesty fixtures stay PASS.
# Live PG 15 CREATE/evolve publish and product JAR PublishHook publish
# stay SKIP unless present AND observed.
# Product G5 is not closed.

on:
  push:
    paths:
      - "scripts/g5-publishhook-ddl-leftover-honesty.sh"
      - "scripts/g5-publishhook-ddl-leftover-honesty/**"
      - "docs/g5-publishhook-ddl-leftover-honesty.md"
      - "docs/engineering/g5-publishhook-ddl-leftover-honesty-EVIDENCE.md"
      - "docs/engineering/g5-publishhook-ddl-leftover-honesty/agent-vm.env"
      - "docs/README.md"
      - ".github/workflows/g5-publishhook-ddl-leftover-honesty.yml"
  pull_request:
    paths:
      - "scripts/g5-publishhook-ddl-leftover-honesty.sh"
      - "scripts/g5-publishhook-ddl-leftover-honesty/**"
      - "docs/g5-publishhook-ddl-leftover-honesty.md"
      - "docs/engineering/g5-publishhook-ddl-leftover-honesty-EVIDENCE.md"
      - "docs/engineering/g5-publishhook-ddl-leftover-honesty/agent-vm.env"
      - "docs/README.md"
      - ".github/workflows/g5-publishhook-ddl-leftover-honesty.yml"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g5-publishhook-ddl-leftover-honesty.sh --verify-report scripts/g5-publishhook-ddl-leftover-honesty/fixtures/honest-skip.env
      - name: Fake live real-DDL publish PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g5-publishhook-ddl-leftover-honesty.sh --verify-report \
            scripts/g5-publishhook-ddl-leftover-honesty/fixtures/fake-live-ddl-publish-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live_real_ddl_publish=PASS without live_real_ddl_publish_observed=true to fail"
            exit 1
          fi
          echo "PASS: fake live real-DDL publish PASS rejected"
      - name: Fake PublishHook publish PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g5-publishhook-ddl-leftover-honesty.sh --verify-report \
            scripts/g5-publishhook-ddl-leftover-honesty/fixtures/fake-publishhook-publish-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live_publishhook_publish=PASS without live_publishhook_publish_observed=true to fail"
            exit 1
          fi
          echo "PASS: fake PublishHook publish PASS rejected"
      - name: Fake #235-remainder-as-live-publish is rejected
        run: |
          set +e
          ./scripts/g5-publishhook-ddl-leftover-honesty.sh --verify-report \
            scripts/g5-publishhook-ddl-leftover-honesty/fixtures/fake-235-as-live-publish.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake honesty_235_remainder_skip_is_not_live_publish=false to fail"
            exit 1
          fi
          echo "PASS: fake #235-as-live-publish rejected"
      - name: Fake #217-abort-as-live-publish is rejected
        run: |
          set +e
          ./scripts/g5-publishhook-ddl-leftover-honesty.sh --verify-report \
            scripts/g5-publishhook-ddl-leftover-honesty/fixtures/fake-217-abort-as-publish.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake honesty_217_abort_skip_is_not_live_publish=false to fail"
            exit 1
          fi
          echo "PASS: fake #217-abort-as-publish rejected"
      - name: Fake product G5 close is rejected
        run: |
          set +e
          ./scripts/g5-publishhook-ddl-leftover-honesty.sh --verify-report \
            scripts/g5-publishhook-ddl-leftover-honesty/fixtures/fake-g5-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g5_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G5 close rejected"
      - name: Fake #235 redo is rejected
        run: |
          set +e
          ./scripts/g5-publishhook-ddl-leftover-honesty.sh --verify-report \
            scripts/g5-publishhook-ddl-leftover-honesty/fixtures/fake-redone.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake redo_235=true to fail"
            exit 1
          fi
          echo "PASS: fake #235 redo rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest leftover #235/#217 PASS / live SKIP
        run: |
          chmod +x ./scripts/g5-publishhook-ddl-leftover-honesty.sh
          ./scripts/g5-publishhook-ddl-leftover-honesty.sh \
            --out "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty"
          ./scripts/g5-publishhook-ddl-leftover-honesty.sh \
            --verify-report "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_235_cells_honest=PASS$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_217_cells_honest=PASS$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_196_cells_honest=PASS$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_235_honesty_gate=PASS$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_217_honesty_gate=PASS$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^honesty_217_contract=PASS$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^honesty_235_contract=PASS$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^honesty_217_abort_skip_is_not_live_publish=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^honesty_235_remainder_skip_is_not_live_publish=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^memory_harness_is_not_real_ddl_publish=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^confirm_only_is_not_real_ddl_publish=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^live_real_ddl_publish=SKIP$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^live_publishhook_publish=SKIP$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^live_real_ddl_publish_observed=false$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^g5_close=NOT_CLAIMED$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g5-publishhook-ddl-leftover-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g5-publishhook-ddl-remainder-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g5-publishhook-ddl-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'linux-arm-profile-remainder-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g15-h5-pkce-miniprogram-remainder-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g17-separation-leftover-honesty-remainder' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g9-leftover-honesty-remainder' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g10-file-object-reconcile-leftover-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'linux-arm-profile-leftover-remainder-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g2-h5-every-page-form-write-report-remainder-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g4-hot-purge-staging-pkce-remainder-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 'g10-file-object-reconcile-remainder-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E 's0-secret-rotate-getenv-leftover-honesty' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_235_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_217_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_236_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_240_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_249_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_259_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_262_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_263_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_254_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_251_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_243_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_241_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_193_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^leftover_157_kept=true$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^redo_235=false$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^redo_217=false$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g5-publishhook-ddl-leftover-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-publishhook-ddl-leftover-honesty
          path: ${{ runner.temp }}/g5-publishhook-ddl-leftover-honesty
