name: g9-live-multi-jvm-replica-remainder-honesty

# Honesty gate for live multi-JVM / replica remainder beyond #209 / #161 / #148.
# Does not start a second JVM or a replica. Does not redo #83/#100/#121/#128/#148/#161/#174/#209.
# Not product G9 / Sentinel / Cluster close.

on:
  push:
    paths:
      - "scripts/g9-live-multi-jvm-replica-remainder-honesty.sh"
      - "scripts/g9-live-multi-jvm-replica-remainder-honesty/**"
      - ".github/workflows/g9-live-multi-jvm-replica-remainder-honesty.yml"
      - "docs/g9-live-multi-jvm-replica-remainder-honesty.md"
      - "docs/engineering/g9-live-multi-jvm-replica-remainder-honesty-EVIDENCE.md"
      - "nexus-permission-core/src/test/java/one/nexus/permission/redis/G9LiveMultiJvmReplicaRemainderHonesty.java"
      - "nexus-permission-core/src/test/java/one/nexus/permission/engine/G9LiveMultiJvmReplicaRemainderHonestyTest.java"
  pull_request:
    paths:
      - "scripts/g9-live-multi-jvm-replica-remainder-honesty.sh"
      - "scripts/g9-live-multi-jvm-replica-remainder-honesty/**"
      - ".github/workflows/g9-live-multi-jvm-replica-remainder-honesty.yml"
      - "docs/g9-live-multi-jvm-replica-remainder-honesty.md"
      - "docs/engineering/g9-live-multi-jvm-replica-remainder-honesty-EVIDENCE.md"
      - "nexus-permission-core/src/test/java/one/nexus/permission/redis/G9LiveMultiJvmReplicaRemainderHonesty.java"
      - "nexus-permission-core/src/test/java/one/nexus/permission/engine/G9LiveMultiJvmReplicaRemainderHonestyTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g9-live-multi-jvm-replica-remainder-honesty.sh --verify-report scripts/g9-live-multi-jvm-replica-remainder-honesty/fixtures/honest-skip.env
      - name: Fake replica PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g9-live-multi-jvm-replica-remainder-honesty.sh --verify-report \
            scripts/g9-live-multi-jvm-replica-remainder-honesty/fixtures/fake-replica-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake replica_promotion=PASS without replica_present=true to fail"
            exit 1
          fi
          echo "PASS: fake replica PASS rejected"
      - name: Fake multi-JVM PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g9-live-multi-jvm-replica-remainder-honesty.sh --verify-report \
            scripts/g9-live-multi-jvm-replica-remainder-honesty/fixtures/fake-multi-jvm-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live_multi_jvm=PASS without second_jvm_present=true to fail"
            exit 1
          fi
          echo "PASS: fake multi-JVM PASS rejected"
      - name: Fake product G9 close is rejected
        run: |
          set +e
          ./scripts/g9-live-multi-jvm-replica-remainder-honesty.sh --verify-report \
            scripts/g9-live-multi-jvm-replica-remainder-honesty/fixtures/fake-g9-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g9_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G9 close rejected"
      - name: Fake Sentinel/Cluster product close is rejected
        run: |
          set +e
          ./scripts/g9-live-multi-jvm-replica-remainder-honesty.sh --verify-report \
            scripts/g9-live-multi-jvm-replica-remainder-honesty/fixtures/fake-sentinel-cluster-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake sentinel_cluster_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake Sentinel/Cluster close rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest inventory PASS / live replica multi-JVM SKIP
        run: |
          chmod +x ./scripts/g9-live-multi-jvm-replica-remainder-honesty.sh
          ./scripts/g9-live-multi-jvm-replica-remainder-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty"
          ./scripts/g9-live-multi-jvm-replica-remainder-honesty.sh \
            --verify-report "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E '^inventory_harness=PASS$' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E '^replica_promotion=SKIP$' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E '^live_multi_jvm=SKIP$' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E '^g9_close=NOT_CLAIMED$' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E '^sentinel_cluster_close=NOT_CLAIMED$' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g9-live-multi-jvm-replica' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g9-sentinel-cluster-remainder-honesty' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g17-separation-leftover-honesty' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g4-pkce-spa-verifier-remainder-honesty' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 's0-secret-rotate-getenv-remainder-honesty' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g6-recovery-port-dry-run-remainder-honesty' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g2-report-physical-dump-honesty' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g10-leftover-honesty-remainder' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g3-outbox-consume-idempotent-honesty' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g15-wx-dt-native-bridge-remainder' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E 'g2-ops-pg-dump-honesty' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E '^g9_83_100_121_128_148_161_174_209_redone=false$' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g9-live-multi-jvm-replica-remainder-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g9-live-multi-jvm-replica-remainder-honesty
          path: ${{ runner.temp }}/g9-live-multi-jvm-replica-remainder-honesty
