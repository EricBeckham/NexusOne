name: g2-form-write-honesty

# Honesty gate for the G2 form.write / POST submissions + submit-start
# dual-check leftover. Does not start a product JAR. Does not redo
# #112 / #116 / #137 / #144 / #150 / #155 / #163. Not product G2 close.

on:
  push:
    paths:
      - "scripts/g2-form-write-honesty.sh"
      - "scripts/g2-form-write-honesty/**"
      - ".github/workflows/g2-form-write-honesty.yml"
      - "docs/g2-form-write-honesty.md"
      - "docs/engineering/g2-form-write-honesty-EVIDENCE.md"
      - "nexus-p3-studio/src/main/java/one/nexus/p3/infra/permission/G2FormWriteHonesty.java"
      - "nexus-p3-studio/src/test/java/one/nexus/p3/infra/permission/G2FormWriteHonestyTest.java"
  pull_request:
    paths:
      - "scripts/g2-form-write-honesty.sh"
      - "scripts/g2-form-write-honesty/**"
      - ".github/workflows/g2-form-write-honesty.yml"
      - "docs/g2-form-write-honesty.md"
      - "docs/engineering/g2-form-write-honesty-EVIDENCE.md"
      - "nexus-p3-studio/src/main/java/one/nexus/p3/infra/permission/G2FormWriteHonesty.java"
      - "nexus-p3-studio/src/test/java/one/nexus/p3/infra/permission/G2FormWriteHonestyTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g2-form-write-honesty.sh --verify-report scripts/g2-form-write-honesty/fixtures/honest-skip.env
      - name: Fake live JAR PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g2-form-write-honesty.sh --verify-report \
            scripts/g2-form-write-honesty/fixtures/fake-live-jar-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live JAR PASS without live_jar_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live JAR PASS rejected"
      - name: Fake product G2 close is rejected
        run: |
          set +e
          ./scripts/g2-form-write-honesty.sh --verify-report \
            scripts/g2-form-write-honesty/fixtures/fake-g2-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g2_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G2 close rejected"
      - name: Fake submit-start-as-form.write-only is rejected
        run: |
          set +e
          ./scripts/g2-form-write-honesty.sh --verify-report \
            scripts/g2-form-write-honesty/fixtures/fake-form-write-only.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake submit_start_is_form_write_only=true to fail"
            exit 1
          fi
          echo "PASS: fake form.write-only claim rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live JAR SKIP
        run: |
          chmod +x ./scripts/g2-form-write-honesty.sh
          ./scripts/g2-form-write-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g2-form-write-honesty"
          ./scripts/g2-form-write-honesty.sh \
            --verify-report "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^live_jar_walk=SKIP$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^live_submissions_observed=false$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^live_submit_start_observed=false$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^g2_close=NOT_CLAIMED$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^submit_start_is_form_write_only=false$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^redone_112=false$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^redone_163=false$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g2-form-write-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-form-write-honesty
          path: ${{ runner.temp }}/g2-form-write-honesty
