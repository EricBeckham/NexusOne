name: g1-fieldpolicy-mask-leftover-honesty

# Honesty gate for FieldPolicy mask / second-auth leftover beyond #162.
# Does not start a product JAR. Does not redo #115/#130/#134/#142/#146/#162/#168.
# Not product G1 close.

on:
  push:
    paths:
      - "scripts/g1-fieldpolicy-mask-leftover-honesty.sh"
      - "scripts/g1-fieldpolicy-mask-second-auth-honesty/**"
      - ".github/workflows/g1-fieldpolicy-mask-leftover-honesty.yml"
      - "docs/g1-fieldpolicy-mask-second-auth-honesty.md"
      - "docs/engineering/g1-fieldpolicy-mask-second-auth-honesty-EVIDENCE.md"
      - "nexus-permission-core/src/main/java/one/nexus/permission/field/FieldPolicyMaskLeftoverHonesty.java"
      - "nexus-permission-core/src/test/java/one/nexus/permission/field/FieldPolicyMaskLeftoverHonestyTest.java"
  pull_request:
    paths:
      - "scripts/g1-fieldpolicy-mask-leftover-honesty.sh"
      - "scripts/g1-fieldpolicy-mask-second-auth-honesty/**"
      - ".github/workflows/g1-fieldpolicy-mask-leftover-honesty.yml"
      - "docs/g1-fieldpolicy-mask-second-auth-honesty.md"
      - "docs/engineering/g1-fieldpolicy-mask-second-auth-honesty-EVIDENCE.md"
      - "nexus-permission-core/src/main/java/one/nexus/permission/field/FieldPolicyMaskLeftoverHonesty.java"
      - "nexus-permission-core/src/test/java/one/nexus/permission/field/FieldPolicyMaskLeftoverHonestyTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g1-fieldpolicy-mask-leftover-honesty.sh --verify-report scripts/g1-fieldpolicy-mask-second-auth-honesty/fixtures/honest-skip.env
      - name: Fake live API mask PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g1-fieldpolicy-mask-leftover-honesty.sh --verify-report \
            scripts/g1-fieldpolicy-mask-second-auth-honesty/fixtures/fake-live-api-mask-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live API mask PASS without live_jar_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live API mask PASS rejected"
      - name: Fake live IsolatedExport mask PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g1-fieldpolicy-mask-leftover-honesty.sh --verify-report \
            scripts/g1-fieldpolicy-mask-second-auth-honesty/fixtures/fake-live-export-mask-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live IsolatedExport mask PASS to fail"
            exit 1
          fi
          echo "PASS: fake live IsolatedExport mask PASS rejected"
      - name: Fake live second-auth PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g1-fieldpolicy-mask-leftover-honesty.sh --verify-report \
            scripts/g1-fieldpolicy-mask-second-auth-honesty/fixtures/fake-live-second-auth-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live second-auth PASS to fail"
            exit 1
          fi
          echo "PASS: fake live second-auth PASS rejected"
      - name: Fake product G1 close is rejected
        run: |
          set +e
          ./scripts/g1-fieldpolicy-mask-leftover-honesty.sh --verify-report \
            scripts/g1-fieldpolicy-mask-second-auth-honesty/fixtures/fake-g1-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g1_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G1 close rejected"
      - name: Fake mask-on-AST is rejected
        run: |
          set +e
          ./scripts/g1-fieldpolicy-mask-leftover-honesty.sh --verify-report \
            scripts/g1-fieldpolicy-mask-second-auth-honesty/fixtures/fake-mask-on-ast.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake mask_on_ast=true to fail"
            exit 1
          fi
          echo "PASS: fake mask-on-AST rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live FieldPolicy mask SKIP
        run: |
          chmod +x ./scripts/g1-fieldpolicy-mask-leftover-honesty.sh
          ./scripts/g1-fieldpolicy-mask-leftover-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty"
          ./scripts/g1-fieldpolicy-mask-leftover-honesty.sh \
            --verify-report "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^live_api_mask=SKIP$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^live_export_mask=SKIP$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^live_second_auth=SKIP$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^isolated_export_applies_mask=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^mask_on_ast=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^g1_close=NOT_CLAIMED$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E 'g1-datascope-or-in-ast' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E 'g1-fieldpolicy-mask-second-auth' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^redone_162=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^redone_168=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g1-fieldpolicy-mask-second-auth-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-fieldpolicy-mask-leftover-honesty
          path: ${{ runner.temp }}/g1-fieldpolicy-mask-second-auth-honesty
