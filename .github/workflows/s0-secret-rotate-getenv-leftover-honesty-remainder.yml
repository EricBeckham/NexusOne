name: s0-secret-rotate-getenv-leftover-honesty-remainder

# Honesty gate for SecretPort rotate / getenv / LocalThenEnv leftover remainder
# beyond #241 / #223. Does not restart a JVM. Does not redo #143/#180/#200/#223/#241.
# Not product S0 / SecretPort close.

on:
  push:
    paths:
      - "scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh"
      - "scripts/s0-secret-rotate-getenv-leftover-honesty-remainder/**"
      - ".github/workflows/s0-secret-rotate-getenv-leftover-honesty-remainder.yml"
      - "docs/s0-secret-rotate-getenv-leftover-honesty-remainder.md"
      - "docs/engineering/s0-secret-rotate-getenv-leftover-honesty-remainder-EVIDENCE.md"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretRotateGetenvLeftoverHonestyRemainder.java"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretRotateGetenvLeftoverHonestyRemainderTest.java"
  pull_request:
    paths:
      - "scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh"
      - "scripts/s0-secret-rotate-getenv-leftover-honesty-remainder/**"
      - ".github/workflows/s0-secret-rotate-getenv-leftover-honesty-remainder.yml"
      - "docs/s0-secret-rotate-getenv-leftover-honesty-remainder.md"
      - "docs/engineering/s0-secret-rotate-getenv-leftover-honesty-remainder-EVIDENCE.md"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretRotateGetenvLeftoverHonestyRemainder.java"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretRotateGetenvLeftoverHonestyRemainderTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh --verify-report scripts/s0-secret-rotate-getenv-leftover-honesty-remainder/fixtures/honest-skip.env
      - name: Fake OS getenv PASS without a walk is rejected
        run: ./scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh --verify-report scripts/s0-secret-rotate-getenv-leftover-honesty-remainder/fixtures/fake-os-getenv-pass.env fail
      - name: Fake live restart PASS without a walk is rejected
        run: ./scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh --verify-report scripts/s0-secret-rotate-getenv-leftover-honesty-remainder/fixtures/fake-live-restart-pass.env fail
      - name: Fake LocalThenEnv.system PASS without a walk is rejected
        run: ./scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh --verify-report scripts/s0-secret-rotate-getenv-leftover-honesty-remainder/fixtures/fake-local-then-env-system-pass.env fail
      - name: Fake product S0 / SecretPort close is rejected
        run: ./scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh --verify-report scripts/s0-secret-rotate-getenv-leftover-honesty-remainder/fixtures/fake-s0-close.env fail
      - name: Fake #180/#200/#223/#241 redo is rejected
        run: ./scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh --verify-report scripts/s0-secret-rotate-getenv-leftover-honesty-remainder/fixtures/fake-redone.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest parent harness PASS / LocalThenEnv PASS / live SKIP
        run: |
          chmod +x ./scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh
          ./scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh --skip-tests \
            --out "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder"
          ./scripts/s0-secret-rotate-getenv-leftover-honesty-remainder.sh \
            --verify-report "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_241_harness=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_223_harness=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_180_harness=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_200_harness=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^env_map_rotate=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^local_then_env_map_rotate=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^local_then_env_overlay_wins=PASS$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^live_os_getenv_rotate=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^live_restart=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^live_local_then_env_system_getenv=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^live_jdbc_runtime_secretport=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^live_s3_client_rotate=SKIP$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^s0_close=NOT_CLAIMED$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^secret_port_close=NOT_CLAIMED$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_259_kept=true$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_249_kept=true$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_240_kept=true$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_254_kept=true$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^leftover_236_kept=true$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E 'g9-leftover-honesty-remainder' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E 'g17-separation-leftover-honesty-remainder' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E 'g15-h5-pkce-miniprogram-remainder-honesty' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E 'g2-h5-every-page-form-write-report-remainder-honesty' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E 'linux-arm-profile-remainder-honesty' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E 's0-secret-rotate-getenv-leftover-honesty' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^redo_241=false$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/s0-secret-rotate-getenv-leftover-honesty-remainder/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0-secret-rotate-getenv-leftover-honesty-remainder
          path: ${{ runner.temp }}/s0-secret-rotate-getenv-leftover-honesty-remainder
