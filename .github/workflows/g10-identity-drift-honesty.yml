name: g10-identity-drift-honesty

# Honesty gate for the G10 identity drift-fix apply/dry-run leftover.
# Does not start Keycloak. Does not redo identity apply / #141 / #169.
# Not product G10 close.

on:
  push:
    paths:
      - "scripts/g10-identity-drift-honesty.sh"
      - "scripts/g10-identity-drift-honesty/**"
      - ".github/workflows/g10-identity-drift-honesty.yml"
      - "docs/g10-identity-drift-honesty.md"
      - "docs/engineering/g10-identity-drift-honesty-EVIDENCE.md"
      - "nexus-p2-iam/src/main/java/one/nexus/p2/account/G10IdentityDriftHonesty.java"
      - "nexus-p2-iam/src/test/java/one/nexus/p2/G10IdentityDriftHonestyTest.java"
  pull_request:
    paths:
      - "scripts/g10-identity-drift-honesty.sh"
      - "scripts/g10-identity-drift-honesty/**"
      - ".github/workflows/g10-identity-drift-honesty.yml"
      - "docs/g10-identity-drift-honesty.md"
      - "docs/engineering/g10-identity-drift-honesty-EVIDENCE.md"
      - "nexus-p2-iam/src/main/java/one/nexus/p2/account/G10IdentityDriftHonesty.java"
      - "nexus-p2-iam/src/test/java/one/nexus/p2/G10IdentityDriftHonestyTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g10-identity-drift-honesty.sh --verify-report scripts/g10-identity-drift-honesty/fixtures/honest-skip.env
      - name: Fake live Keycloak PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g10-identity-drift-honesty.sh --verify-report \
            scripts/g10-identity-drift-honesty/fixtures/fake-live-keycloak-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live Keycloak PASS without live_keycloak_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live Keycloak PASS rejected"
      - name: Fake live apply PASS is rejected
        run: |
          set +e
          ./scripts/g10-identity-drift-honesty.sh --verify-report \
            scripts/g10-identity-drift-honesty/fixtures/fake-live-apply-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live apply PASS to fail"
            exit 1
          fi
          echo "PASS: fake live apply PASS rejected"
      - name: Fake product G10 close is rejected
        run: |
          set +e
          ./scripts/g10-identity-drift-honesty.sh --verify-report \
            scripts/g10-identity-drift-honesty/fixtures/fake-g10-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g10_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G10 close rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live Keycloak 8080 SKIP
        run: |
          chmod +x ./scripts/g10-identity-drift-honesty.sh
          ./scripts/g10-identity-drift-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g10-identity-drift-honesty"
          ./scripts/g10-identity-drift-honesty.sh \
            --verify-report "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^live_keycloak_8080=SKIP$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^live_dry_run_observed=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^live_apply=SKIP$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^live_apply_observed=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^g10_close=NOT_CLAIMED$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^identity_apply_product_redone=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^identity_drift_141_redone=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^file_reconcile_169_redone=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^saml_claimed=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^ldap_claimed=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^sms_mfa_claimed=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g10-identity-drift-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-identity-drift-honesty
          path: ${{ runner.temp }}/g10-identity-drift-honesty
