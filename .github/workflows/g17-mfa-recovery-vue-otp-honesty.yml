name: g17-mfa-recovery-vue-otp-honesty

# Honesty gate for MFA recovery email / Vue OTP writeback leftover beyond #172/#158.
# Does not start Keycloak or SMTP. Does not redo #96/#118/#133/#154/#158/#172.
# Not product G17 / 等保 / 密评.

on:
  push:
    paths:
      - "scripts/g17-mfa-recovery-vue-otp-honesty.sh"
      - "scripts/g17-mfa-recovery-vue-otp-honesty/**"
      - ".github/workflows/g17-mfa-recovery-vue-otp-honesty.yml"
      - "docs/g17-mfa-recovery-vue-otp-honesty.md"
      - "docs/engineering/g17-mfa-recovery-vue-otp-honesty-EVIDENCE.md"
      - "docs/README.md"
  pull_request:
    paths:
      - "scripts/g17-mfa-recovery-vue-otp-honesty.sh"
      - "scripts/g17-mfa-recovery-vue-otp-honesty/**"
      - ".github/workflows/g17-mfa-recovery-vue-otp-honesty.yml"
      - "docs/g17-mfa-recovery-vue-otp-honesty.md"
      - "docs/engineering/g17-mfa-recovery-vue-otp-honesty-EVIDENCE.md"
      - "docs/README.md"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g17-mfa-recovery-vue-otp-honesty.sh --verify-report scripts/g17-mfa-recovery-vue-otp-honesty/fixtures/honest-skip.env
      - name: Fake live delivery PASS without SMTP / mailbox is rejected
        run: |
          set +e
          ./scripts/g17-mfa-recovery-vue-otp-honesty.sh --verify-report \
            scripts/g17-mfa-recovery-vue-otp-honesty/fixtures/fake-delivery-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake email_delivery=PASS without smtp_enabled=true to fail"
            exit 1
          fi
          echo "PASS: fake delivery PASS rejected"
      - name: Fake Vue write-back PASS without issuer / endpoint is rejected
        run: |
          set +e
          ./scripts/g17-mfa-recovery-vue-otp-honesty.sh --verify-report \
            scripts/g17-mfa-recovery-vue-otp-honesty/fixtures/fake-writeback-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake vue_otp_writeback=PASS without issuer/endpoint to fail"
            exit 1
          fi
          echo "PASS: fake write-back PASS rejected"
      - name: Fake product G17 close is rejected
        run: |
          set +e
          ./scripts/g17-mfa-recovery-vue-otp-honesty.sh --verify-report \
            scripts/g17-mfa-recovery-vue-otp-honesty/fixtures/fake-g17-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g17_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G17 close rejected"
      - name: Fake #158/#172 redo is rejected
        run: |
          set +e
          ./scripts/g17-mfa-recovery-vue-otp-honesty.sh --verify-report \
            scripts/g17-mfa-recovery-vue-otp-honesty/fixtures/fake-redone.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake redo_158/redo_172 to fail"
            exit 1
          fi
          echo "PASS: fake redo rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect honest IdP / SMTP SKIP
        run: |
          chmod +x ./scripts/g17-mfa-recovery-vue-otp-honesty.sh
          ./scripts/g17-mfa-recovery-vue-otp-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty"
          ./scripts/g17-mfa-recovery-vue-otp-honesty.sh \
            --verify-report "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^leftover_172_harness=PASS$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^leftover_158_harness=PASS$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^email_delivery=SKIP$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^recovery_live=SKIP$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^vue_otp_writeback=SKIP$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^mailbox_observed=false$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^g17_close=NOT_CLAIMED$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^redo_158=false$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^redo_172=false$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E '^vue_writes_keycloak_otp=false$' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E 'g17-mfa-recovery-email-honesty' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
          grep -E 'g17-vue-otp-writeback' "$RUNNER_TEMP/g17-mfa-recovery-vue-otp-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g17-mfa-recovery-vue-otp-honesty
          path: ${{ runner.temp }}/g17-mfa-recovery-vue-otp-honesty
