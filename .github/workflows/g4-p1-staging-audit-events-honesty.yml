name: g4-p1-staging-audit-events-honesty

# Honesty gate for the G4 P1 staging audit-events leftover beyond #156.
# Does not start PostgreSQL. Does not switch GET off staging.
# Does not redo #147/#152/#156/#166. Not product G4 close.

on:
  push:
    paths:
      - "scripts/g4-p1-staging-audit-events-honesty.sh"
      - "scripts/g4-p1-staging-audit-events-honesty/**"
      - ".github/workflows/g4-p1-staging-audit-events-honesty.yml"
      - "docs/g4-p1-staging-audit-events-honesty.md"
      - "docs/engineering/g4-p1-staging-audit-events-honesty-EVIDENCE.md"
      - "nexus-p1-tenant/src/main/java/one/nexus/p1/audit/G4P1StagingAuditEventsHonesty.java"
      - "nexus-p1-tenant/src/test/java/one/nexus/p1/audit/G4P1StagingAuditEventsHonestyTest.java"
  pull_request:
    paths:
      - "scripts/g4-p1-staging-audit-events-honesty.sh"
      - "scripts/g4-p1-staging-audit-events-honesty/**"
      - ".github/workflows/g4-p1-staging-audit-events-honesty.yml"
      - "docs/g4-p1-staging-audit-events-honesty.md"
      - "docs/engineering/g4-p1-staging-audit-events-honesty-EVIDENCE.md"
      - "nexus-p1-tenant/src/main/java/one/nexus/p1/audit/G4P1StagingAuditEventsHonesty.java"
      - "nexus-p1-tenant/src/test/java/one/nexus/p1/audit/G4P1StagingAuditEventsHonestyTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g4-p1-staging-audit-events-honesty.sh --verify-report scripts/g4-p1-staging-audit-events-honesty/fixtures/honest-skip.env
      - name: Fake live :5432 PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g4-p1-staging-audit-events-honesty.sh --verify-report \
            scripts/g4-p1-staging-audit-events-honesty/fixtures/fake-live-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live_staging_5432=PASS without live_staging_present=true to fail"
            exit 1
          fi
          echo "PASS: fake live :5432 PASS rejected"
      - name: Fake product G4 close is rejected
        run: |
          set +e
          ./scripts/g4-p1-staging-audit-events-honesty.sh --verify-report \
            scripts/g4-p1-staging-audit-events-honesty/fixtures/fake-g4-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g4_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G4 close rejected"
      - name: Switching GET off staging is rejected
        run: |
          set +e
          ./scripts/g4-p1-staging-audit-events-honesty.sh --verify-report \
            scripts/g4-p1-staging-audit-events-honesty/fixtures/fake-switched-off-staging.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake switched_off_staging=true to fail"
            exit 1
          fi
          echo "PASS: fake switched_off_staging rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live :5432 SKIP
        run: |
          chmod +x ./scripts/g4-p1-staging-audit-events-honesty.sh
          ./scripts/g4-p1-staging-audit-events-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty"
          ./scripts/g4-p1-staging-audit-events-honesty.sh \
            --verify-report "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^staging_like_path=PASS$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^get_still_on_staging=true$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^switched_off_staging=false$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^live_staging_5432=SKIP$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^live_query_observed=false$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^live_export_observed=false$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^g4_close=NOT_CLAIMED$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^redo_147=false$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^redo_152=false$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^redo_156=false$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^redo_166=false$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g4-p1-staging-audit-events-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-p1-staging-audit-events-honesty
          path: ${{ runner.temp }}/g4-p1-staging-audit-events-honesty
