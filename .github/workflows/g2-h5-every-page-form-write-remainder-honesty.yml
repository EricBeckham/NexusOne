name: g2-h5-every-page-form-write-remainder-honesty

# Honesty gate for the G2 H5 every-page / form.write remainder leftover
# beyond #204/#163/#173. Does not start a product JAR.
# Does not redo #112 / #116 / #137 / #144 / #150 / #155 / #163 / #173 / #204.
# Not product G2 close.

on:
  push:
    paths:
      - "scripts/g2-h5-every-page-form-write-remainder-honesty.sh"
      - "scripts/g2-h5-every-page-form-write-remainder-honesty/**"
      - ".github/workflows/g2-h5-every-page-form-write-remainder-honesty.yml"
      - "docs/g2-h5-every-page-form-write-remainder-honesty.md"
      - "docs/engineering/g2-h5-every-page-form-write-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"
  pull_request:
    paths:
      - "scripts/g2-h5-every-page-form-write-remainder-honesty.sh"
      - "scripts/g2-h5-every-page-form-write-remainder-honesty/**"
      - ".github/workflows/g2-h5-every-page-form-write-remainder-honesty.yml"
      - "docs/g2-h5-every-page-form-write-remainder-honesty.md"
      - "docs/engineering/g2-h5-every-page-form-write-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-remainder-honesty/fixtures/honest-skip.env
      - name: Fake live JAR PASS without a walk is rejected
        run: ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-remainder-honesty/fixtures/fake-live-jar-pass.env fail
      - name: Fake live H5 PASS without a walk is rejected
        run: ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-remainder-honesty/fixtures/fake-live-h5-pass.env fail
      - name: Fake #204-harness-as-live-JAR is rejected
        run: ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-remainder-honesty/fixtures/fake-harness-as-live.env fail
      - name: Fake product G2 close is rejected
        run: ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-remainder-honesty/fixtures/fake-g2-close.env fail
      - name: Fake #204 redo is rejected
        run: ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-remainder-honesty/fixtures/fake-redone.env fail
      - name: Fake H5-open-as-covered is rejected
        run: ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-remainder-honesty/fixtures/fake-h5-open-closed.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live JAR SKIP
        run: |
          chmod +x ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh
          ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty"
          ./scripts/g2-h5-every-page-form-write-remainder-honesty.sh \
            --verify-report "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^harness_204_contract=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^harness_204_is_not_live_jar=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^harness_204_is_not_live_h5=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^harness_204_is_not_h5_open_covered=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^h5_every_page_harness=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^form_write_harness=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^live_jar_walk=SKIP$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^live_h5_walk=SKIP$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^g2_close=NOT_CLAIMED$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^h5_open_pages_still_open=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^leftover_rows_all=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^redone_163=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^redone_173=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^redone_204=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-remainder-honesty/report.env"
          grep -F 'g2-h5-every-page-form-write-honesty' docs/README.md
          grep -F 'g2-report-physical-dump-honesty' docs/README.md
          grep -F 'g10-leftover-honesty-remainder' docs/README.md
          grep -F 'g3-outbox-consume-idempotent-honesty' docs/README.md
          grep -F 'g6-recovery-port-dry-run-remainder-honesty' docs/README.md
          grep -F 's0-secret-rotate-getenv-remainder-honesty' docs/README.md
          grep -F 'g4-pkce-spa-verifier-remainder-honesty' docs/README.md
          grep -F 'g17-separation-leftover-honesty' docs/README.md
          grep -F 'g15-wx-dt-native-bridge-remainder' docs/README.md
          grep -F 'g1-queryast-export-honesty' docs/README.md
          grep -F 'g17-gm-tls-nginx-handshake-honesty' docs/README.md
          grep -F 'g5-publishhook-ddl-honesty' docs/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-h5-every-page-form-write-remainder-honesty
          path: ${{ runner.temp }}/g2-h5-every-page-form-write-remainder-honesty
