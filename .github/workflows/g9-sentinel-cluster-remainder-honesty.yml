name: g9-sentinel-cluster-remainder-honesty

# Honesty gate for Sentinel / Cluster remainder beyond #148 / #161.
# Does not start Redis Sentinel / Cluster. Does not redo #83/#100/#121/#128/#148/#161/#174.
# Not product G9 close.

on:
  push:
    paths:
      - "scripts/g9-sentinel-cluster-remainder-honesty.sh"
      - "scripts/g9-sentinel-cluster-remainder-honesty/**"
      - ".github/workflows/g9-sentinel-cluster-remainder-honesty.yml"
      - "docs/g9-sentinel-cluster-remainder-honesty.md"
      - "docs/engineering/g9-sentinel-cluster-remainder-honesty-EVIDENCE.md"
      - "nexus-permission-core/src/test/java/one/nexus/permission/redis/G9SentinelClusterRemainderHonesty.java"
      - "nexus-permission-core/src/test/java/one/nexus/permission/engine/G9SentinelClusterRemainderHonestyTest.java"
  pull_request:
    paths:
      - "scripts/g9-sentinel-cluster-remainder-honesty.sh"
      - "scripts/g9-sentinel-cluster-remainder-honesty/**"
      - ".github/workflows/g9-sentinel-cluster-remainder-honesty.yml"
      - "docs/g9-sentinel-cluster-remainder-honesty.md"
      - "docs/engineering/g9-sentinel-cluster-remainder-honesty-EVIDENCE.md"
      - "nexus-permission-core/src/test/java/one/nexus/permission/redis/G9SentinelClusterRemainderHonesty.java"
      - "nexus-permission-core/src/test/java/one/nexus/permission/engine/G9SentinelClusterRemainderHonestyTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g9-sentinel-cluster-remainder-honesty.sh --verify-report scripts/g9-sentinel-cluster-remainder-honesty/fixtures/honest-skip.env
      - name: Fake Sentinel PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g9-sentinel-cluster-remainder-honesty.sh --verify-report \
            scripts/g9-sentinel-cluster-remainder-honesty/fixtures/fake-sentinel-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake sentinel_failover=PASS without sentinel_present=true to fail"
            exit 1
          fi
          echo "PASS: fake Sentinel PASS rejected"
      - name: Fake Cluster PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g9-sentinel-cluster-remainder-honesty.sh --verify-report \
            scripts/g9-sentinel-cluster-remainder-honesty/fixtures/fake-cluster-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake cluster_failover=PASS without cluster_enabled=true to fail"
            exit 1
          fi
          echo "PASS: fake Cluster PASS rejected"
      - name: Fake product G9 close is rejected
        run: |
          set +e
          ./scripts/g9-sentinel-cluster-remainder-honesty.sh --verify-report \
            scripts/g9-sentinel-cluster-remainder-honesty/fixtures/fake-g9-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g9_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G9 close rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest inventory PASS / live Sentinel Cluster SKIP
        run: |
          chmod +x ./scripts/g9-sentinel-cluster-remainder-honesty.sh
          ./scripts/g9-sentinel-cluster-remainder-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty"
          ./scripts/g9-sentinel-cluster-remainder-honesty.sh \
            --verify-report "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E '^inventory_harness=PASS$' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E '^sentinel_failover=SKIP$' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E '^cluster_failover=SKIP$' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E '^g9_close=NOT_CLAIMED$' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E 'g9-sentinel-cluster-honesty' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E 'g3-outbox-consume-crash-honesty' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E 'g5-mid-publish-failure-honesty' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E 'g10-leftover-honesty' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E 'g4-export-wizard-deny-honesty' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E 'g2-h5-every-page-form-write-honesty' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E 'g9-redis-down-invalidate-remainder' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E 'g17-mfa-recovery-vue-otp-honesty' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E 'g2-ops-pg-dump-honesty' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E '^g9_83_100_121_128_148_161_174_redone=false$' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g9-sentinel-cluster-remainder-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g9-sentinel-cluster-remainder-honesty
          path: ${{ runner.temp }}/g9-sentinel-cluster-remainder-honesty
