name: g17-gm-tls-nginx-handshake

# Honesty gate for the G17 real Tongsuo/Nginx GMTLS handshake leftover.
# Does not install Tongsuo. Does not redo #110 dual-cert or #129 Java probe.
# Not 等保 / 密评 / HSM / G17 close.

on:
  push:
    paths:
      - "scripts/g17-gm-tls-nginx-handshake.sh"
      - "scripts/g17-gm-tls-nginx-handshake/**"
      - ".github/workflows/g17-gm-tls-nginx-handshake.yml"
      - "docs/g17-gm-tls-nginx-handshake.md"
      - "docs/engineering/g17-gm-tls-nginx-handshake-EVIDENCE.md"
  pull_request:
    paths:
      - "scripts/g17-gm-tls-nginx-handshake.sh"
      - "scripts/g17-gm-tls-nginx-handshake/**"
      - ".github/workflows/g17-gm-tls-nginx-handshake.yml"
      - "docs/g17-gm-tls-nginx-handshake.md"
      - "docs/engineering/g17-gm-tls-nginx-handshake-EVIDENCE.md"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g17-gm-tls-nginx-handshake.sh --verify-report scripts/g17-gm-tls-nginx-handshake/fixtures/honest-skip.env
      - name: Fake GMTLS PASS without Tongsuo is rejected
        run: |
          set +e
          ./scripts/g17-gm-tls-nginx-handshake.sh --verify-report \
            scripts/g17-gm-tls-nginx-handshake/fixtures/fake-handshake-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake handshake PASS without tongsuo_nginx=true to fail"
            exit 1
          fi
          echo "PASS: fake handshake PASS rejected"
      - name: Fake 等保/密评/HSM/G17-close claims are rejected
        run: |
          set +e
          ./scripts/g17-gm-tls-nginx-handshake.sh --verify-report \
            scripts/g17-gm-tls-nginx-handshake/fixtures/fake-claims.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake 等保/密评/HSM/G17-close claims to fail"
            exit 1
          fi
          echo "PASS: fake claims rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest nginx SKIP
        run: |
          chmod +x ./scripts/g17-gm-tls-nginx-handshake.sh
          ./scripts/g17-gm-tls-nginx-handshake.sh \
            --out "$RUNNER_TEMP/g17-gm-tls-nginx-handshake"
          ./scripts/g17-gm-tls-nginx-handshake.sh \
            --verify-report "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
          grep -E '^nginx_gmtls_handshake=SKIP$' "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
          grep -E '^handshake_observed=false$' "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
          grep -E '^g17_close=NOT_CLAIMED$' "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
          grep -E '^dengbao_claimed=false$' "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
          grep -E '^hsm_claimed=false$' "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
          grep -E '^dual_cert_110_redone=false$' "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
          grep -E '^dual_stack_129_redone=false$' "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g17-gm-tls-nginx-handshake/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g17-gm-tls-nginx-handshake
          path: ${{ runner.temp }}/g17-gm-tls-nginx-handshake
