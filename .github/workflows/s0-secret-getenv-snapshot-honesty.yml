name: s0-secret-getenv-snapshot-honesty

# Honesty gate for OS System.getenv() startup-snapshot leftover beyond #143.
# Does not introduce OpenBao / KMS. Does not redo #143. Not product S0 close.

on:
  push:
    paths:
      - "scripts/s0-secret-getenv-snapshot-honesty.sh"
      - "scripts/s0-secret-getenv-snapshot-honesty/**"
      - ".github/workflows/s0-secret-getenv-snapshot-honesty.yml"
      - "docs/s0-secret-getenv-snapshot-honesty.md"
      - "docs/engineering/s0-secret-getenv-snapshot-honesty-EVIDENCE.md"
      - "nexus-crypto-core/src/main/java/one/nexus/crypto/S0SecretGetenvSnapshotHonesty.java"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretGetenvSnapshotHonestyTest.java"
  pull_request:
    paths:
      - "scripts/s0-secret-getenv-snapshot-honesty.sh"
      - "scripts/s0-secret-getenv-snapshot-honesty/**"
      - ".github/workflows/s0-secret-getenv-snapshot-honesty.yml"
      - "docs/s0-secret-getenv-snapshot-honesty.md"
      - "docs/engineering/s0-secret-getenv-snapshot-honesty-EVIDENCE.md"
      - "nexus-crypto-core/src/main/java/one/nexus/crypto/S0SecretGetenvSnapshotHonesty.java"
      - "nexus-crypto-core/src/test/java/one/nexus/crypto/S0SecretGetenvSnapshotHonestyTest.java"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/s0-secret-getenv-snapshot-honesty.sh --verify-report scripts/s0-secret-getenv-snapshot-honesty/fixtures/honest-skip.env
      - name: Fake OS getenv PASS without mutation / observed rotate is rejected
        run: |
          set +e
          ./scripts/s0-secret-getenv-snapshot-honesty.sh --verify-report \
            scripts/s0-secret-getenv-snapshot-honesty/fixtures/fake-os-getenv-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake os_getenv_rotate=PASS without os_getenv_mutable=true to fail"
            exit 1
          fi
          echo "PASS: fake OS getenv PASS rejected"
      - name: Fake product S0 close is rejected
        run: |
          set +e
          ./scripts/s0-secret-getenv-snapshot-honesty.sh --verify-report \
            scripts/s0-secret-getenv-snapshot-honesty/fixtures/fake-s0-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake s0_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake S0 close rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest OS getenv snapshot SKIP
        run: |
          chmod +x ./scripts/s0-secret-getenv-snapshot-honesty.sh
          ./scripts/s0-secret-getenv-snapshot-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty"
          ./scripts/s0-secret-getenv-snapshot-honesty.sh \
            --verify-report "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^env_map_rotate=PASS$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^os_getenv_rotate=SKIP$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^os_getenv_rotate_observed=false$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^s0_close=NOT_CLAIMED$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^s0_143_redone=false$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^openbao_introduced=false$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^kms_introduced=false$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/s0-secret-getenv-snapshot-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0-secret-getenv-snapshot-honesty
          path: ${{ runner.temp }}/s0-secret-getenv-snapshot-honesty
