name: g7-withdraw-browser-evidence-honesty

# Honesty gate for browser-visible G7 withdraw evidence beyond
# #82/#103/#113/#159/#175/#192. Does not start a product JAR.
# Does not redo parent leftovers. Not product G7 close.

on:
  push:
    paths:
      - "scripts/g7-withdraw-browser-evidence-honesty.sh"
      - "scripts/g7-withdraw-browser-evidence-honesty/**"
      - ".github/workflows/g7-withdraw-browser-evidence-honesty.yml"
      - "docs/g7-withdraw-browser-evidence-honesty.md"
      - "docs/engineering/g7-withdraw-browser-evidence-honesty-EVIDENCE.md"
      - "docs/README.md"
  pull_request:
    paths:
      - "scripts/g7-withdraw-browser-evidence-honesty.sh"
      - "scripts/g7-withdraw-browser-evidence-honesty/**"
      - ".github/workflows/g7-withdraw-browser-evidence-honesty.yml"
      - "docs/g7-withdraw-browser-evidence-honesty.md"
      - "docs/engineering/g7-withdraw-browser-evidence-honesty-EVIDENCE.md"
      - "docs/README.md"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g7-withdraw-browser-evidence-honesty.sh --verify-report \
          scripts/g7-withdraw-browser-evidence-honesty/fixtures/honest-skip.env
      - name: Fake live JAR PASS without a walk is rejected
        run: ./scripts/g7-withdraw-browser-evidence-honesty.sh --verify-report \
          scripts/g7-withdraw-browser-evidence-honesty/fixtures/fake-live-pass.env fail
      - name: Fake product G7 close is rejected
        run: ./scripts/g7-withdraw-browser-evidence-honesty.sh --verify-report \
          scripts/g7-withdraw-browser-evidence-honesty/fixtures/fake-g7-close.env fail
      - name: Fake parent leftover redo is rejected
        run: ./scripts/g7-withdraw-browser-evidence-honesty.sh --verify-report \
          scripts/g7-withdraw-browser-evidence-honesty/fixtures/fake-redone.env fail
      - name: Fake stub-as-live PASS is rejected
        run: ./scripts/g7-withdraw-browser-evidence-honesty.sh --verify-report \
          scripts/g7-withdraw-browser-evidence-honesty/fixtures/fake-stub-as-live.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live JAR SKIP
        run: |
          chmod +x ./scripts/g7-withdraw-browser-evidence-honesty.sh
          ./scripts/g7-withdraw-browser-evidence-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty"
          ./scripts/g7-withdraw-browser-evidence-honesty.sh \
            --verify-report "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^browser_visible_stub_walk=PASS$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^leave_withdraw_http=PASS$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^expense_travel_withdraw_http=PASS$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^vue_todo_withdraw_control=PASS$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^live_jar_idp_browser_withdraw=SKIP$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^live_browser_visible_withdraw=SKIP$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^live_browser_query_click=SKIP$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^g7_close=NOT_CLAIMED$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^stub_walk_is_not_live=true$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^leftover_rows_all=true$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^same_tx_append_unchanged=PASS$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^redone_175=false$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^redone_192=false$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g7-withdraw-browser-evidence-honesty/report.env"
          grep -F 'g9-redis-down-invalidate-remainder' docs/README.md
          grep -F 'g2-h5-every-page-form-write-honesty' docs/README.md
          grep -F 'g17-mfa-recovery-vue-otp-honesty' docs/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g7-withdraw-browser-evidence-honesty
          path: ${{ runner.temp }}/g7-withdraw-browser-evidence-honesty
