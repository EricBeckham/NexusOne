name: g3-outbox-consume-idempotent-honesty

# Honesty leftover beyond #195/#139/#170.
# Does not re-run g3-outbox-consume-crash-honesty.sh or #139/#170 suites.
# Live multi-node Dispatcher / real crash window stay SKIP unless observed.
# Product G3 is not closed.

on:
  push:
    paths:
      - "scripts/g3-outbox-consume-idempotent-honesty.sh"
      - "scripts/g3-outbox-consume-idempotent-honesty/**"
      - "docs/g3-outbox-consume-idempotent-honesty.md"
      - "docs/engineering/g3-outbox-consume-idempotent-honesty-EVIDENCE.md"
      - "docs/README.md"
      - ".github/workflows/g3-outbox-consume-idempotent-honesty.yml"
  pull_request:
    paths:
      - "scripts/g3-outbox-consume-idempotent-honesty.sh"
      - "scripts/g3-outbox-consume-idempotent-honesty/**"
      - "docs/g3-outbox-consume-idempotent-honesty.md"
      - "docs/engineering/g3-outbox-consume-idempotent-honesty-EVIDENCE.md"
      - "docs/README.md"
      - ".github/workflows/g3-outbox-consume-idempotent-honesty.yml"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g3-outbox-consume-idempotent-honesty.sh --verify-report scripts/g3-outbox-consume-idempotent-honesty/fixtures/honest-skip.env
      - name: Fake live crash PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g3-outbox-consume-idempotent-honesty.sh --verify-report \
            scripts/g3-outbox-consume-idempotent-honesty/fixtures/fake-live-crash-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake live crash PASS without live_crash_observed=true to fail"
            exit 1
          fi
          echo "PASS: fake live crash PASS rejected"
      - name: Fake multi-node PASS without a walk is rejected
        run: |
          set +e
          ./scripts/g3-outbox-consume-idempotent-honesty.sh --verify-report \
            scripts/g3-outbox-consume-idempotent-honesty/fixtures/fake-multi-node-pass.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake multi-node PASS without second_jvm_present=true to fail"
            exit 1
          fi
          echo "PASS: fake multi-node PASS rejected"
      - name: Fake product G3 close is rejected
        run: |
          set +e
          ./scripts/g3-outbox-consume-idempotent-honesty.sh --verify-report \
            scripts/g3-outbox-consume-idempotent-honesty/fixtures/fake-g3-close.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake g3_close=CLOSED to fail"
            exit 1
          fi
          echo "PASS: fake G3 close rejected"
      - name: Fake #195 redo is rejected
        run: |
          set +e
          ./scripts/g3-outbox-consume-idempotent-honesty.sh --verify-report \
            scripts/g3-outbox-consume-idempotent-honesty/fixtures/fake-redone.env
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected fake redone_195=true to fail"
            exit 1
          fi
          echo "PASS: fake #195 redo rejected"

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest leftover consume/crash PASS / live SKIP
        run: |
          chmod +x ./scripts/g3-outbox-consume-idempotent-honesty.sh
          ./scripts/g3-outbox-consume-idempotent-honesty.sh \
            --out "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty"
          ./scripts/g3-outbox-consume-idempotent-honesty.sh \
            --verify-report "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_139_cells_honest=PASS$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_170_cells_honest=PASS$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_195_cells_honest=PASS$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^consume_idempotent=PASS$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^crash_window=SIMULATED$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^live_crash=SKIP$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^live_crash_observed=false$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^multi_node_dispatcher=SKIP$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^multi_node_observed=false$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^g3_close=NOT_CLAIMED$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g3-outbox-consume-idempotent' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g3-claim-crash-window' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g3-outbox-consume-crash-honesty' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g10-leftover-honesty-remainder' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g2-report-physical-dump-honesty' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g6-recovery-port-dry-run-remainder-honesty' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 's0-secret-rotate-getenv-remainder-honesty' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g4-pkce-spa-verifier-remainder-honesty' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g17-separation-leftover-honesty' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g15-wx-dt-native-bridge-remainder' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E 'g1-queryast-export-honesty' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_139_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_170_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_195_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_228_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_221_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_225_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_223_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_222_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_216_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_220_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^leftover_215_kept=true$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^redone_139=false$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^redone_170=false$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^redone_195=false$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^outbox_dispatcher_redesigned=false$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g3-outbox-consume-idempotent-honesty/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-outbox-consume-idempotent-honesty
          path: ${{ runner.temp }}/g3-outbox-consume-idempotent-honesty
