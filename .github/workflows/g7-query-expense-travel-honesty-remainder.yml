name: g7-query-expense-travel-honesty-remainder

# Honesty remainder gate beyond #192/#140/#212.
# Does not start the product JAR, IdP, or Playwright.
# Does not redo #103/#113/#140/#159/#175/#192/#212.
# Not product G7 close.

on:
  push:
    paths:
      - "scripts/g7-query-expense-travel-honesty-remainder.sh"
      - "scripts/g7-query-expense-travel-honesty-remainder/**"
      - ".github/workflows/g7-query-expense-travel-honesty-remainder.yml"
      - "docs/g7-query-expense-travel-honesty-remainder.md"
      - "docs/engineering/g7-query-expense-travel-honesty-remainder-EVIDENCE.md"
      - "docs/README.md"
  pull_request:
    paths:
      - "scripts/g7-query-expense-travel-honesty-remainder.sh"
      - "scripts/g7-query-expense-travel-honesty-remainder/**"
      - ".github/workflows/g7-query-expense-travel-honesty-remainder.yml"
      - "docs/g7-query-expense-travel-honesty-remainder.md"
      - "docs/engineering/g7-query-expense-travel-honesty-remainder-EVIDENCE.md"
      - "docs/README.md"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g7-query-expense-travel-honesty-remainder.sh --verify-report scripts/g7-query-expense-travel-honesty-remainder/fixtures/honest-skip.env
      - name: Fake live PASS without JAR/IdP is rejected
        run: ./scripts/g7-query-expense-travel-honesty-remainder.sh --verify-report \
          scripts/g7-query-expense-travel-honesty-remainder/fixtures/fake-live-pass.env fail
      - name: Fake live browser query PASS is rejected
        run: ./scripts/g7-query-expense-travel-honesty-remainder.sh --verify-report \
          scripts/g7-query-expense-travel-honesty-remainder/fixtures/fake-browser-pass.env fail
      - name: Fake product G7 close is rejected
        run: ./scripts/g7-query-expense-travel-honesty-remainder.sh --verify-report \
          scripts/g7-query-expense-travel-honesty-remainder/fixtures/fake-g7-close.env fail
      - name: Fake #140/#192/#212 redo is rejected
        run: ./scripts/g7-query-expense-travel-honesty-remainder.sh --verify-report \
          scripts/g7-query-expense-travel-honesty-remainder/fixtures/fake-redone.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest query PASS / live JAR/IdP SKIP
        run: |
          chmod +x ./scripts/g7-query-expense-travel-honesty-remainder.sh
          ./scripts/g7-query-expense-travel-honesty-remainder.sh \
            --out "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder"
          ./scripts/g7-query-expense-travel-honesty-remainder.sh \
            --verify-report "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_140_cells_honest=PASS$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_192_cells_honest=PASS$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_192_honesty_gate=PASS$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_212_cells_honest=PASS$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^query_surface=PASS$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^expense_query_surface=PASS$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^travel_query_surface=PASS$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^live_jar_idp_query=SKIP$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^live_browser_query_click=SKIP$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^query_walk_observed=false$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^g7_close=NOT_CLAIMED$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_rows_kept=true$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E 'g7-query-expense-travel-honesty' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E 'g7-withdraw-browser-evidence-honesty' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E 'g2-h5-every-page-form-write-remainder-honesty' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E 'g9-redis-down-invalidate-remainder-honesty' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E 'g4-hot-purge-staging-leftover-honesty' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_192_kept=true$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_212_kept=true$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_230_kept=true$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_232_kept=true$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_237_kept=true$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^g7_140_redone=false$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_192_redone=false$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^leftover_212_redone=false$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g7-query-expense-travel-honesty-remainder/report.env"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g7-query-expense-travel-honesty-remainder
          path: ${{ runner.temp }}/g7-query-expense-travel-honesty-remainder
