name: g2-h5-every-page-form-write-report-remainder-honesty

# Honesty gate for the G2 H5 every-page / form.write / report physical-dump
# remainder leftover beyond #232/#221/#204. Does not start a product JAR.
# Does not redo #112 / #116 / #122 / #124 / #137 / #144 / #150 / #155 / #163
# / #173 / #204 / #221 / #232. Not product G2 close.

on:
  push:
    paths:
      - "scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh"
      - "scripts/g2-h5-every-page-form-write-report-remainder-honesty/**"
      - ".github/workflows/g2-h5-every-page-form-write-report-remainder-honesty.yml"
      - "docs/g2-h5-every-page-form-write-report-remainder-honesty.md"
      - "docs/engineering/g2-h5-every-page-form-write-report-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"
  pull_request:
    paths:
      - "scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh"
      - "scripts/g2-h5-every-page-form-write-report-remainder-honesty/**"
      - ".github/workflows/g2-h5-every-page-form-write-report-remainder-honesty.yml"
      - "docs/g2-h5-every-page-form-write-report-remainder-honesty.md"
      - "docs/engineering/g2-h5-every-page-form-write-report-remainder-honesty-EVIDENCE.md"
      - "docs/README.md"

jobs:
  honesty-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Honest SKIP report is accepted
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/honest-skip.env
      - name: Fake live JAR PASS without a walk is rejected
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/fake-live-jar-pass.env fail
      - name: Fake live H5 PASS without a walk is rejected
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/fake-live-h5-pass.env fail
      - name: Fake live report PASS without a walk is rejected
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/fake-live-report-pass.env fail
      - name: Fake live dump PASS without a walk is rejected
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/fake-live-dump-pass.env fail
      - name: Fake #232-remainder-as-live is rejected
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/fake-232-as-live.env fail
      - name: Fake #221-harness-as-live is rejected
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/fake-221-as-live.env fail
      - name: Fake product G2 close is rejected
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/fake-g2-close.env fail
      - name: Fake #232/#221 redo is rejected
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/fake-redone.env fail
      - name: Fake report-is-dump is rejected
        run: ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --verify-report \
          scripts/g2-h5-every-page-form-write-report-remainder-honesty/fixtures/fake-report-is-dump.env fail

  inventory-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect honest live JAR / report / dump SKIP
        run: |
          chmod +x ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh
          ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh --skip-tests \
            --out "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty"
          ./scripts/g2-h5-every-page-form-write-report-remainder-honesty.sh \
            --verify-report "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^honesty_232_contract=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^honesty_221_contract=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^harness_204_contract=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^honesty_232_is_not_live_jar=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^honesty_221_is_not_live_report=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^harness_204_is_not_live_jar=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^combined_232_221_204_is_not_product_g2=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^report_is_physical_dump=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^h5_every_page_harness=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^form_write_harness=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^report_surface_harness=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^dump_surface_harness=PASS$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^live_jar_walk=SKIP$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^live_h5_walk=SKIP$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^live_report_walk=SKIP$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^live_dump_walk=SKIP$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^g2_close=NOT_CLAIMED$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^leftover_rows_all=true$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^redone_204=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^redone_221=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^redone_232=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^g18_status=closed_unchanged$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^audit_port_changed=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -E '^p0_m0_redone=false$' "$RUNNER_TEMP/g2-h5-every-page-form-write-report-remainder-honesty/report.env"
          grep -F 'g2-h5-every-page-form-write-remainder-honesty' docs/README.md
          grep -F 'g2-report-physical-dump-honesty' docs/README.md
          grep -F 'g2-h5-every-page-form-write-honesty' docs/README.md
          grep -F 's0-secret-rotate-getenv-leftover-honesty' docs/README.md
          grep -F 'g5-publishhook-ddl-remainder-honesty' docs/README.md
          grep -F 'g10-file-object-reconcile-remainder-honesty' docs/README.md
          grep -F 'g10-leftover-honesty-remainder' docs/README.md
          grep -F 'g4-hot-purge-staging-pkce-remainder-honesty' docs/README.md
          grep -F 'linux-arm-profile-remainder-honesty' docs/README.md
          grep -F 'g2-h5-every-page-form-write-report-remainder-honesty' docs/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-h5-every-page-form-write-report-remainder-honesty
          path: ${{ runner.temp }}/g2-h5-every-page-form-write-report-remainder-honesty
