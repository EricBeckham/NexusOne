# Both application JDBC and embedded Flowable use Spring's one DataSource.
spring.datasource.url=${POC_JDBC_URL:jdbc:postgresql://localhost:5432/nexus_poc?currentSchema=flowable,public}
spring.datasource.username=${POC_DB_USER:nexus_poc}
spring.datasource.password=${POC_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
flowable.database-schema=flowable
flowable.database-schema-update=true
flowable.async-executor-activate=true
flowable.check-process-definitions=true
flowable.process-definition-location-prefix=classpath*:/processes/
flowable.process-definition-location-suffixes=**.bpmn20.xml,**.bpmn
logging.level.org.flowable=INFO
